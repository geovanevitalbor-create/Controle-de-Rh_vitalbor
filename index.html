/* =====================================================================
   VITALBOR · SISTEMA DE RH — visual 3.0
   Tokens de cor (claro/escuro), tipografia Archivo (largura variável),
   componentes e telas. Cores da marca: azul #3E4095 · laranja #F58634.
   ===================================================================== */

:root{
  color-scheme:light;
  /* superfícies */
  --bg:#F1F2F7; --surface:#FFFFFF; --surface-2:#F6F7FB; --surface-3:#ECEEF5;
  --line:#E3E5EF; --line-2:#D2D5E3;
  /* tinta */
  --ink:#171936; --ink-2:#4A4E70; --ink-3:#7A7EA0;
  /* marca */
  --brand:#3E4095; --brand-hover:#4F52C2; --brand-ink:#3E4095; --brand-soft:#EAEBF8; --brand-softer:#F3F3FB;
  --accent:#F58634; --accent-ink:#B4560F; --accent-soft:#FEF0E4;
  /* estados (sempre com ícone ou texto junto) */
  --ok:#1E9A55; --ok-ink:#16733F; --ok-soft:#E3F4EA;
  --warn:#E3A008; --warn-ink:#8F6200; --warn-soft:#FDF3D7;
  --bad:#D93A3A; --bad-ink:#B02A2A; --bad-soft:#FCE9E9;
  --info:#3D7FE0; --info-ink:#2B63B8; --info-soft:#E7F0FC;
  --festa:#B4489F; --festa-soft:#F8E8F5;
  /* menu lateral */
  --rail:#1F2156; --rail-2:#2A2D6B; --rail-ink:#C9CBF0; --rail-dim:#8F92CF; --rail-on:rgba(255,255,255,.10);
  /* séries dos gráficos (validadas: faixa de luminosidade, daltonismo, contraste) */
  --s1:#4F52C2; --s2:#F58634; --s3:#14A38B; --s4:#E3A008; --s5:#D9578C; --s6:#2E8B57; --s7:#3D9BE0; --s8:#E04F4F;
  --s1-fraco:#C9CAF0;
  --o1:#9EA0E8; --o2:#7C7FDC; --o3:#5B5ECD; --o4:#4245AE; --o5:#2F3187;
  --grid:#ECEDF4; --eixo:#D2D5E3;
  /* sombras e raios */
  --sh-1:0 1px 2px rgba(23,25,54,.05);
  --sh-2:0 10px 30px -12px rgba(23,25,54,.22),0 2px 6px rgba(23,25,54,.06);
  --sh-3:0 30px 80px -20px rgba(23,25,54,.35),0 6px 18px rgba(23,25,54,.10);
  --r-panel:16px; --r-ctl:10px; --r-sm:8px;
  /* movimento */
  --ease:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
  --d1:.12s; --d2:.22s; --d3:.42s;
  /* tipografia */
  --font:'Archivo','Archivo Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --larga:114%; --semi:106%;
  --side:248px; --side-mini:76px; --top:64px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0E1C; --surface:#161830; --surface-2:#1B1E3A; --surface-3:#22254A;
  --line:#262A4B; --line-2:#343860;
  --ink:#ECEDF8; --ink-2:#B4B7D8; --ink-3:#8488B0;
  --brand:#6E72E6; --brand-hover:#8286F0; --brand-ink:#A6A9F5; --brand-soft:rgba(110,114,230,.16); --brand-softer:rgba(110,114,230,.08);
  --accent:#F58634; --accent-ink:#FFB27A; --accent-soft:rgba(245,134,52,.15);
  --ok:#2DB26A; --ok-ink:#6FDC9E; --ok-soft:rgba(45,178,106,.15);
  --warn:#E3A008; --warn-ink:#F5C85A; --warn-soft:rgba(227,160,8,.15);
  --bad:#E55353; --bad-ink:#FF9C9C; --bad-soft:rgba(229,83,83,.15);
  --info:#4D8FEA; --info-ink:#9CC2FA; --info-soft:rgba(77,143,234,.15);
  --festa:#D47AC2; --festa-soft:rgba(212,122,194,.16);
  --rail:#0A0B18; --rail-2:#14162C; --rail-ink:#C3C6EC; --rail-dim:#7D81B4; --rail-on:rgba(255,255,255,.08);
  --s1:#7376E8; --s2:#DC6A22; --s3:#12917C; --s4:#BD8006; --s5:#D35E8E; --s6:#2A8452; --s7:#3787CC; --s8:#DD5555;
  --s1-fraco:#34376F;
  --o1:#4A4DB0; --o2:#5E62CF; --o3:#7376E8; --o4:#9295F0; --o5:#B4B6F6;
  --grid:#22254A; --eixo:#343860;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 14px 34px -12px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);
  --sh-3:0 30px 90px -20px rgba(0,0,0,.75),0 6px 18px rgba(0,0,0,.4);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);font-stretch:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body.tema-trocando,body.tema-trocando *{transition:background-color .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease),fill .3s var(--ease) !important;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
img,svg{display:block;}
/* ícones de traço (viewBox 24) sem tamanho próprio: padrão discreto; qualquer regra com classe vence */
:where(svg[viewBox="0 0 24 24"]:not([width])){width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
a{color:var(--brand-ink);}
::selection{background:var(--brand);color:#fff;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px;}
[hidden]{display:none !important;}
.num{font-variant-numeric:tabular-nums;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.larga{font-stretch:var(--larga);}
.dim{color:var(--ink-3);}
.ink2{color:var(--ink-2);}

/* ----------------------------------------------------------- botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:var(--r-ctl);border:1px solid transparent;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background var(--d1),border-color var(--d1),color var(--d1),transform var(--d1) var(--ease),box-shadow var(--d1);user-select:none;}
.btn:active{transform:scale(.97);}
.btn svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-pri{background:var(--brand);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 16px -8px var(--brand);}
.btn-pri:hover{background:var(--brand-hover);}
.btn-sec{background:var(--surface);border-color:var(--line-2);color:var(--ink);}
.btn-sec:hover{border-color:var(--ink-3);}
.btn-ghost{background:transparent;color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink);}
.btn-perigo{background:var(--surface);border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad-ink);}
.btn-perigo:hover{background:var(--bad-soft);}
.btn-ok{background:var(--surface);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok-ink);}
.btn-ok:hover{background:var(--ok-soft);}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px;}
.btn-ico{width:38px;padding:0;}
.btn-sm.btn-ico{width:32px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.link{border:none;background:none;padding:0;color:var(--brand-ink);font-weight:600;font-size:13px;}
.link:hover{text-decoration:underline;text-underline-offset:3px;}

/* ----------------------------------------------------------- campos */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0;}
.campo>label,.rotulo{font-size:12.5px;font-weight:600;color:var(--ink-2);}
.inp,.campo input:not([type=checkbox]):not([type=radio]),.campo select,.campo textarea,select.inp{width:100%;height:40px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;transition:border-color var(--d1),box-shadow var(--d1);}
.campo textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.45;}
.inp:focus,.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.campo .dica{font-size:12px;color:var(--ink-3);}
.campo input:disabled:not([type=checkbox]):not([type=radio]),.campo select:disabled,.campo textarea:disabled{background-color:var(--surface-2);color:var(--ink-3);cursor:not-allowed;}
.campo .erro{font-size:12px;color:var(--bad-ink);}
.campo.invalido input,.campo.invalido select{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft);}
select.inp,.campo select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;}
.busca{position:relative;display:flex;align-items:center;}
.busca svg{position:absolute;left:12px;width:16px;height:16px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;pointer-events:none;}
.busca input{padding-left:36px !important;}
.chk{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;}
.chk input{appearance:none;-webkit-appearance:none;width:36px;height:21px;border-radius:999px;background:var(--line-2);position:relative;margin:0;cursor:pointer;transition:background var(--d2);flex:none;}
.chk input::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--d2) var(--ease);}
.chk input:checked{background:var(--brand);}
.chk input:checked::after{transform:translateX(15px);}

/* segmentado com indicador que desliza */
.seg{position:relative;display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line);isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{position:relative;z-index:1;border:none;background:none;height:30px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:color var(--d2);}
.seg button:hover{color:var(--ink);}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{color:var(--ink);}
.seg .seg-ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(23,25,54,.12),0 0 0 1px var(--line);transition:transform var(--d3) var(--ease),width var(--d3) var(--ease);}
:root[data-theme="dark"] .seg .seg-ind{background:var(--surface-3);box-shadow:0 0 0 1px var(--line-2);}
:root[data-theme="dark"] .seg{background:var(--surface-2);}
.seg.sm button{height:26px;padding:0 10px;font-size:12px;}

/* abas de tela com sublinhado que desliza */
.abas{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none;}
.abas::-webkit-scrollbar{display:none;}
.abas button{position:relative;border:none;background:none;padding:12px 4px 13px;margin-right:18px;font-size:14px;font-weight:600;color:var(--ink-3);white-space:nowrap;transition:color var(--d2);display:inline-flex;align-items:center;gap:8px;}
.abas button:hover{color:var(--ink);}
.abas button[aria-selected="true"]{color:var(--ink);}
.abas button i{font-style:normal;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);}
.abas .aba-ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;border-radius:2px;background:var(--brand);transition:transform var(--d3) var(--ease),width var(--d3) var(--ease);}

/* chips / etiquetas */
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2);}
.tag svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.tag.ok{background:var(--ok-soft);color:var(--ok-ink);}
.tag.warn{background:var(--warn-soft);color:var(--warn-ink);}
.tag.bad{background:var(--bad-soft);color:var(--bad-ink);}
.tag.info{background:var(--info-soft);color:var(--info-ink);}
.tag.brand{background:var(--brand-soft);color:var(--brand-ink);}
.tag.festa{background:var(--festa-soft);color:var(--festa);}
.tag.laranja{background:var(--accent-soft);color:var(--accent-ink);}
.ponto{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--ink-3);}
.ponto.ok{background:var(--ok);} .ponto.warn{background:var(--warn);} .ponto.bad{background:var(--bad);} .ponto.info{background:var(--info);}

.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;white-space:nowrap;}
.delta svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.delta.bom{color:var(--ok-ink);} .delta.ruim{color:var(--bad-ink);} .delta.neutro{color:var(--ink-3);}

/* ----------------------------------------------------------- login */
.login{position:fixed;inset:0;z-index:300;display:grid;grid-template-columns:minmax(360px,44%) 1fr;background:var(--bg);}
.login-marca{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:44px 48px;background:var(--rail);color:#fff;overflow:hidden;}
.login-marca .lockup{display:flex;align-items:center;gap:18px;margin:auto 0;}
.login-marca .lockup svg{width:72px;height:56px;flex:none;}
.login-marca .lockup b{display:block;font-size:46px;line-height:1;font-weight:700;font-stretch:122%;letter-spacing:.01em;}
.login-marca .lockup span{display:block;margin-top:8px;font-size:17px;font-weight:500;font-stretch:108%;color:var(--rail-ink);}
.login-marca .rod{font-size:12.5px;color:var(--rail-dim);}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px;}
.login-caixa{width:100%;max-width:380px;}
.login-caixa h1{margin:0 0 6px;font-size:28px;font-weight:650;font-stretch:var(--larga);letter-spacing:-.01em;}
.login-caixa>p{margin:0 0 26px;color:var(--ink-2);}
.login-caixa .campo{margin-bottom:16px;}
.login-caixa .btn{width:100%;height:44px;font-size:14.5px;margin-top:6px;}
.login-nota{margin:22px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line-2);font-size:12.5px;color:var(--ink-2);line-height:1.55;}
.login-nota b{color:var(--ink);}
.login-erro{min-height:20px;margin-top:10px;font-size:13px;color:var(--bad-ink);}
.login-erro:empty{min-height:10px;}
.login-link{display:block;margin:10px auto 0;padding:8px 6px;font-size:13.5px;}
.login-caixa .btn:disabled{opacity:.7;cursor:progress;}
/* perfil Consulta: só leitura (o banco barra a gravação de qualquer jeito; aqui só some o botão) */
.perfil-consulta [data-so-editor]{display:none !important;}
.perfil-consulta .brinde{pointer-events:none;}
.login-erro.treme{animation:treme .38s;}
.login-aviso{padding:12px 14px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn-ink);font-size:13.5px;line-height:1.55;}
.login-aviso b{color:inherit;}
.login.saindo{animation:loginSai .45s var(--ease) forwards;}
.login.saindo .login-caixa{animation:caixaSai .35s var(--ease-in) forwards;}
@keyframes loginSai{to{opacity:0;visibility:hidden;}}
@keyframes caixaSai{to{opacity:0;transform:translateY(-12px) scale(.98);}}
@keyframes treme{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.login .login-caixa{animation:sobe .6s var(--ease) both .05s;}
.login .lockup{animation:sobe .7s var(--ease) both;}

/* ----------------------------------------------------------- estrutura */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;transition:grid-template-columns var(--d3) var(--ease);}
body.menu-mini .app{grid-template-columns:var(--side-mini) minmax(0,1fr);}
.lateral{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--rail);color:var(--rail-ink);padding:16px 12px 14px;overflow:hidden;z-index:60;}
.lat-marca{display:flex;align-items:center;gap:11px;height:44px;padding:0 8px;margin-bottom:12px;color:#fff;text-decoration:none;border:none;background:none;text-align:left;}
.lat-marca svg{width:34px;height:26px;flex:none;}
.lat-marca b{display:block;font-size:17px;font-weight:700;font-stretch:120%;letter-spacing:.01em;line-height:1.05;white-space:nowrap;}
.lat-marca small{display:block;font-size:12px;font-weight:500;color:var(--rail-dim);white-space:nowrap;}
.lat-nav{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;margin:0 -4px;padding:0 4px;}
.lat-nav::-webkit-scrollbar{display:none;}
.lat-grupo{margin-top:14px;}
.lat-grupo>small{display:block;padding:0 10px 6px;font-size:12px;font-weight:600;color:var(--rail-dim);white-space:nowrap;}
.lat-it{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border:none;border-radius:10px;background:none;color:var(--rail-ink);font-size:13.5px;font-weight:500;text-align:left;white-space:nowrap;transition:color var(--d1),background var(--d1);}
.lat-it:hover{color:#fff;background:rgba(255,255,255,.05);}
.lat-it.on{color:#fff;font-weight:600;}
.lat-it svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}
.lat-it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.lat-it em{font-style:normal;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--rail-ink);}
.lat-it em.alerta{background:var(--accent);color:#1d1203;}
.lat-ind{position:absolute;left:4px;right:4px;top:0;height:40px;border-radius:10px;background:var(--rail-on);transition:transform var(--d3) var(--ease),opacity var(--d2);pointer-events:none;z-index:0;}
.lat-ind::before{content:'';position:absolute;left:-4px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
.lat-pe{border-top:1px solid rgba(255,255,255,.08);padding-top:10px;margin-top:10px;}
.lat-pe .lat-it{height:38px;color:var(--rail-dim);}
.lat-pe .lat-it:hover{color:#fff;}
body.menu-mini .lat-marca span,body.menu-mini .lat-it span,body.menu-mini .lat-it em,body.menu-mini .lat-grupo>small{opacity:0;pointer-events:none;}
body.menu-mini .lat-grupo>small{height:0;padding:0;overflow:hidden;}
body.menu-mini .lat-grupo{margin-top:10px;border-top:1px solid rgba(255,255,255,.06);padding-top:8px;}
body.menu-mini .lat-it{justify-content:flex-start;}
.lat-marca span,.lat-it span,.lat-it em{transition:opacity var(--d2);}
.lat-mini svg{transition:transform var(--d3) var(--ease);}
body.menu-mini .lat-mini svg{transform:rotate(180deg);}
/* submenus: a setinha abre e fecha; o grupo da tela atual abre sozinho */
.lat-pai{position:relative;}
.lat-it.tem-sub{padding-right:40px;}
.lat-exp{position:absolute;z-index:2;right:6px;top:6px;width:28px;height:28px;display:grid;place-items:center;border:none;border-radius:8px;background:none;color:var(--rail-dim);transition:color var(--d1),background var(--d1);}
.lat-exp:hover,.lat-exp:focus-visible{color:#fff;background:rgba(255,255,255,.09);}
.lat-exp svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--d3) var(--ease);}
.lat-pai.aberto .lat-exp svg{transform:rotate(180deg);}
.lat-sub{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--d3) var(--ease),visibility 0s linear var(--d3);}
.lat-pai.aberto .lat-sub{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows var(--d3) var(--ease),visibility 0s;}
.lat-sub>div{min-height:0;overflow:hidden;}
.lat-sub>div>:first-child{margin-top:2px;}
.lat-sub>div>:last-child{margin-bottom:6px;}
.lat-sub-it{position:relative;display:block;width:100%;height:34px;padding:0 10px 0 41px;border:none;border-radius:8px;background:none;color:var(--rail-dim);font-size:13px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--d1),background var(--d1);}
.lat-sub-it::before{content:'';position:absolute;left:19px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.13);}
.lat-sub-it::after{content:'';position:absolute;left:18px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent);opacity:0;transform:scaleY(.4);transition:opacity var(--d2),transform var(--d2) var(--ease);}
.lat-sub-it:hover{color:#fff;background:rgba(255,255,255,.05);}
.lat-sub-it.on{color:#fff;font-weight:600;}
.lat-sub-it.on::after{opacity:1;transform:none;}
body.menu-mini .lat-exp,body.menu-mini .lat-sub{display:none;}

.veu-menu{display:none;}
.principal{min-width:0;display:flex;flex-direction:column;}
.topo{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;height:var(--top);padding:0 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color var(--d2);}
.topo.rolou{border-bottom-color:var(--line);}
.topo-menu{display:none;}
.topo-busca{display:flex;align-items:center;gap:10px;height:40px;min-width:0;width:min(440px,100%);padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-size:13.5px;text-align:left;transition:border-color var(--d1),box-shadow var(--d1);}
.topo-busca:hover{border-color:var(--ink-3);}
.topo-busca svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
.topo-busca span:not(.kbd){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topo-busca .kbd{flex:none;}
.kbd{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-3);background:var(--surface-2);white-space:nowrap;}
.topo-esp{flex:1;}
.topo .btn-ico{color:var(--ink-2);}
.sino{position:relative;}
.sino-n{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--accent);color:#1d1203;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--bg);}
.sino.balanca svg{animation:balanca .9s var(--ease);transform-origin:50% 10%;}
@keyframes balanca{0%,100%{transform:none}20%{transform:rotate(14deg)}40%{transform:rotate(-11deg)}60%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--brand);color:#fff;font-size:13px;font-weight:700;font-stretch:110%;border:none;}
.avatar.sm{width:30px;height:30px;font-size:11.5px;}
.avatar.lg{width:56px;height:56px;font-size:19px;}
.avatar.suave{background:var(--brand-soft);color:var(--brand-ink);}
.tema-ico .lua{display:none;}
:root[data-theme="dark"] .tema-ico .sol{display:none;}
:root[data-theme="dark"] .tema-ico .lua{display:block;}

.tela{flex:1;width:100%;max-width:1480px;margin:0 auto;padding:6px 28px 110px;}
#ini-ag .tarefa{grid-template-columns:auto minmax(0,1fr);row-gap:2px;}
#ini-ag .tarefa .meta{grid-column:2;justify-content:flex-start;}
.tela.entra{animation:sobe .38s var(--ease) both;}
.tela.sai{animation:desce .14s var(--ease-in) both;}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes desce{to{opacity:0;transform:translateY(4px)}}
@keyframes surge{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin:14px 0 22px;}
.cab h1{margin:0;font-size:30px;line-height:1.1;font-weight:650;font-stretch:var(--larga);letter-spacing:-.015em;}
.cab p{margin:6px 0 0;color:var(--ink-2);max-width:72ch;}
.cab-acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filtros{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.filtros .inp{width:auto;min-width:170px;height:38px;}
.filtros .busca{flex:1 1 260px;max-width:380px;}
/* filtro de período: botão com o período aplicado + painel de atalhos e datas */
.per-btn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-align:left;transition:border-color var(--d1),background var(--d1);}
.per-btn:hover,.per-btn[aria-expanded="true"]{border-color:var(--brand);}
.per-btn > svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--ink-2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.per-btn > svg:last-child{width:15px;height:15px;transition:transform var(--d2) var(--ease);}
.per-btn[aria-expanded="true"] > svg:last-child{transform:rotate(180deg);}
.per-t{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.per-t b{font-size:13.5px;font-weight:650;white-space:nowrap;}
.per-t small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;}
.suspenso.a-esq{left:0;right:auto;transform-origin:top left;}
.per-menu{width:min(340px,calc(100vw - 24px));}
.per-g{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);}
.suspenso .per-op{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:8px 10px;}
.suspenso .per-op small{display:inline;font-size:12px;color:var(--ink-3);}
.suspenso .per-op[aria-pressed="true"]{font-weight:650;background:var(--brand-softer);}
.per-ck{display:inline-grid;place-items:center;width:18px;height:18px;}
.suspenso .per-ck svg,.per-g .per-ck svg{width:16px;height:16px;stroke:var(--brand-ink);stroke-width:2.6;}
.per-custom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:4px 8px 6px;}
.per-custom label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);min-width:0;}
.per-custom .inp{height:36px;padding:0 8px;font-size:13px;min-width:0;}
.per-custom .btn{height:36px;}
.per-erro{padding:0 10px 4px;font-size:12px;color:var(--bad-ink);}
.per-erro:empty{display:none;}
.per-info{display:flex;align-items:flex-start;gap:8px;margin:-6px 0 16px;font-size:12.5px;color:var(--ink-2);line-height:1.5;}
.per-info svg{width:15px;height:15px;flex:none;margin-top:2px;fill:none;stroke:var(--ink-3);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.per-info b{color:var(--ink);font-weight:600;}
/* ------------------------------------------------------------ comparativo de meses */
.cp-sel .painel-corpo{display:flex;flex-direction:column;gap:12px;}
.cp-sel-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;}
.cp-atalhos{display:flex;gap:6px;flex-wrap:wrap;}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;transition:border-color var(--d1),color var(--d1),background var(--d1);}
.chip:hover{border-color:var(--brand);color:var(--ink);}
.cp-meses{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;}
.cp-mes{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 2px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background var(--d1),border-color var(--d1),color var(--d1),transform var(--d2) var(--ease);}
.cp-mes b{font-size:13.5px;font-weight:650;}
.cp-mes small{font-size:11px;color:var(--ink-3);}
.cp-mes i{position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:background var(--d1),border-color var(--d1);}
.cp-mes i svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--d1);}
.cp-mes:hover{border-color:var(--ink-3);color:var(--ink);}
.cp-mes:active{transform:scale(.97);}
.cp-mes.on{border-color:var(--cm);background:color-mix(in srgb,var(--cm) 13%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px var(--cm);}
.cp-mes.on i{background:var(--cm);border-color:var(--cm);}
.cp-mes.on i svg{opacity:1;}
.cp-sel-pe{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.cp-sel-pe .inp{width:auto;min-width:200px;height:38px;}
.cp-nota{font-size:12.5px;flex:1 1 320px;line-height:1.45;}
.cp-nota b{color:var(--ink-2);}
.cp-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 10px;font-size:13px;font-weight:600;}
.cp-leg span{display:inline-flex;align-items:center;gap:7px;}
.cp-leg i{width:12px;height:12px;border-radius:4px;}
.cp-leg em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink-3);padding:1px 7px;border-radius:999px;background:var(--surface-3);}
.cp-insight{margin:0 0 16px;}
.cp-tab td small{display:block;font-size:11.5px;margin-top:1px;}
.cp-tab .cp-v{display:block;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.cp-tab .cp-d{display:block;margin-top:2px;}
.cp-tab .cp-d .delta{font-size:11.5px;}
.cp-tab tr.cp-grupo td{background:var(--surface-2);font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:7px;padding-bottom:7px;}
.cp-tab .cp-var{background:var(--surface-2);}
.tab-graf.cp-tab-caixa,.cp-setores .tab-graf{max-height:none;overflow:visible;}
.cp-pt{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;}
.cp-sec{margin:24px 0 12px;font-size:18px;font-weight:650;font-stretch:var(--semi);}
.cp-grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px;}
.cp-card{padding:14px 14px 6px;min-width:0;}
.cp-card-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.cp-card h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-2);}
.cp-card-v{display:block;font-size:20px;font-weight:650;font-stretch:var(--semi);margin-top:2px;white-space:nowrap;}
.cp-st td{vertical-align:middle;}
.cp-barra{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-bottom:4px;min-width:64px;}
.cp-barra i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:cresceX .6s var(--ease) both;}
.cp-st .num{font-size:12.5px;font-variant-numeric:tabular-nums;}
.so-impressao{display:none;}
.cp-rodape{display:none;}
.cp-imp{align-items:center;gap:18px;padding:0 0 12px;margin-bottom:12px;border-bottom:2px solid #3E4095;}
.cp-imp-marca{display:flex;align-items:center;gap:8px;}
.cp-imp-marca b{display:block;font-size:15px;font-weight:800;letter-spacing:.04em;font-stretch:var(--larga);color:#3E4095;}
.cp-imp-marca span{display:block;font-size:10px;color:#555;}
.cp-imp-tit{flex:1;}
.cp-imp-tit h1{margin:0;font-size:20px;}
.cp-imp-tit p{margin:2px 0 0;font-size:12px;color:#444;}
.cp-imp-meta{font-size:10.5px;color:#555;text-align:right;line-height:1.4;}
@media (max-width:1280px){.cp-grade{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:860px){.cp-meses{grid-template-columns:repeat(6,minmax(0,1fr));}.cp-mes i{display:none;}.cp-mes.on{box-shadow:inset 0 0 0 2px var(--cm);}}
@media (max-width:560px){.cp-grade{grid-template-columns:minmax(0,1fr);}.cp-sel-pe .inp{width:100%;}}
.filtros .busca .inp{width:100%;}
.filtros .conta{margin-left:auto;font-size:12.5px;color:var(--ink-3);}

/* ----------------------------------------------------------- painéis */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--sh-1);min-width:0;}
.painel-cab{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:16px 18px 0;}
.painel-cab h2,.painel-cab h3{margin:0;font-size:15.5px;font-weight:650;font-stretch:var(--semi);}
.painel-cab .sub{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--ink-3);font-stretch:100%;}
.painel-cab .acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.painel-cab>*{min-width:0;max-width:100%;}
.painel-corpo{padding:14px 18px 18px;}
.painel-pe{padding:12px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);}
.grade{display:grid;gap:16px;}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr);}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr);}
.g-1-1{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:28px 16px;color:var(--ink-3);font-size:13px;}
.vazio svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px;}
.vazio b{color:var(--ink);font-size:14px;}

/* faixa de indicadores (um painel dividido, não quatro cartões) */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--sh-1);overflow:hidden;}
.kpi{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:16px 18px 14px;border:none;border-left:1px solid var(--line);background:none;text-align:left;transition:background var(--d1);}
.kpi:first-child{border-left:none;}
button.kpi:hover{background:var(--surface-2);}
.kpi .k{font-size:13px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:7px;}
.kpi .v{font-size:34px;line-height:1.15;font-weight:620;font-stretch:var(--larga);letter-spacing:-.02em;white-space:nowrap;margin-top:4px;}
.kpi .v small{font-size:16px;font-weight:550;color:var(--ink-2);letter-spacing:0;margin-left:2px;}
.kpi .s{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.kpi > .spark{position:absolute;right:16px;top:18px;width:84px;height:30px;}
/* sparkline interativa: a área de passar o mouse é maior que o desenho */
.kpi .spark-hit{position:absolute;right:8px;top:10px;padding:8px;border-radius:10px;cursor:crosshair;touch-action:pan-y;}
.kpi .spark-hit .spark{display:block;}
.spark .sp-foco{opacity:0;transition:opacity var(--d1),transform .12s var(--ease);}
.spark-hit.on .sp-foco{opacity:1;}
.spark .sp-cruz{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2;}
.spark .sp-ponto{stroke:var(--surface);stroke-width:1.5;transition:transform .12s var(--ease);}
.spark-hit.on .sp-ult{opacity:.35;}
button.kpi:hover .spark-hit{background:color-mix(in srgb,var(--surface) 55%,transparent);}
.kpi.sm .v{font-size:26px;}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr));}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr));}

/* ----------------------------------------------------------- gráficos */
.graf{position:relative;width:100%;}
.graf svg{overflow:visible;}
.graf text{font-family:var(--font);}
.g-eixo{fill:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums;}
.g-eixo.sel{fill:var(--ink);font-weight:700;}
.g-grade{stroke:var(--grid);stroke-width:1;}
.g-base{stroke:var(--eixo);stroke-width:1;}
.g-rot{fill:var(--ink);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;}
.g-rot2{fill:var(--ink-3);font-size:11px;}
.g-barra{transition:opacity var(--d2);}
.g-barra.apagada{opacity:.28;}
.g-hit{fill:transparent;cursor:pointer;outline:none;}
.g-hit:hover,.g-hit.on{fill:color-mix(in srgb,var(--ink) 4%,transparent);}
.g-hit.linha:hover,.g-hit.linha.on{fill:transparent;}
.g-hit:focus-visible{stroke:var(--brand);stroke-width:1.5;}
.g-linha{fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round;}
.g-area{opacity:.12;}
.g-pt{stroke:var(--surface);stroke-width:2;}
.g-cruz{stroke:var(--ink-3);stroke-width:1;opacity:.7;}
.g-linha.forte{stroke-width:3;}
.g-sel{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.8;}
.g-meta{stroke:var(--accent);stroke-width:1.5;}
.legenda{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);}
.legenda .it{display:inline-flex;align-items:center;gap:7px;border:none;background:none;padding:2px 0;color:inherit;font-size:inherit;}
.legenda button.it{cursor:pointer;}
.legenda .it[aria-pressed="false"]{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2);}
.legenda .it[aria-pressed="false"] .sw{opacity:.3;}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block;}
.sw.ln{width:14px;height:3px;border-radius:2px;}
.dica-g{position:fixed;z-index:400;min-width:180px;max-width:300px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--sh-2);font-size:12.5px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity var(--d1),transform var(--d1) var(--ease);}
.dica-g.on{opacity:1;transform:none;}
.dica-g .t{font-weight:650;margin-bottom:6px;color:var(--ink);}
.dica-g .l{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:8px;padding:2px 0;}
.dica-g .l b{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);}
.dica-g .l span{color:var(--ink-2);}
.dica-g .k{display:block;width:12px;height:3px;border-radius:2px;}
.dica-g .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;}
.dica-g .h{margin-top:6px;color:var(--ink-3);font-size:11.5px;}
.tab-graf{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;}

/* ranking (barras horizontais em HTML) */
.rank{display:flex;flex-direction:column;}
.rank-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;padding:9px 6px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);font-size:13px;border-radius:8px;transition:background var(--d1);}
.rank-l:last-child{border-bottom:none;}
button.rank-l:hover{background:var(--surface-2);}
.rank-l .n{display:flex;align-items:center;gap:8px;min-width:0;}
.rank-l .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-l .n small{color:var(--ink-3);font-size:12px;white-space:nowrap;}
.rank-l .v{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rank-l .v small{font-weight:500;color:var(--ink-3);margin-left:6px;font-size:12px;}
.rank-l .t{grid-column:1/-1;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.rank-l .t i{display:block;height:100%;border-radius:999px;background:var(--s1);transform-origin:left;animation:cresceX .7s var(--ease) both;}
.rank-l.alerta .t i{background:var(--s2);}
@keyframes cresceX{from{transform:scaleX(0)}to{transform:none}}
.rank-pos{width:20px;font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;}

/* ----------------------------------------------------------- tabelas */
.tabela-caixa{position:relative;overflow:auto;border-top:1px solid var(--line);}
.tabela-caixa.alta{max-height:calc(100vh - 330px);min-height:280px;}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;}
.t th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;padding:0;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink-2);font-size:12.5px;white-space:nowrap;}
.t th>button,.t th>span{display:flex;align-items:center;gap:6px;width:100%;padding:10px 14px;border:none;background:none;color:inherit;font:inherit;text-align:left;}
.t th>button:hover{color:var(--ink);}
.t th.n>button,.t th.n>span{justify-content:flex-end;}
.t th .seta{font-style:normal;font-size:11px;opacity:.4;}
.t th[aria-sort="ascending"] .seta,.t th[aria-sort="descending"] .seta{opacity:1;color:var(--brand-ink);}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;}
.t td.n{text-align:right;font-variant-numeric:tabular-nums;}
.t td.quebra{white-space:normal;min-width:220px;}
.t tbody tr{transition:background var(--d1);}
.t tbody tr[data-id],.t tbody tr[data-abrir]{cursor:pointer;}
.t tbody tr[data-id]:hover,.t tbody tr[data-abrir]:hover{background:var(--brand-softer);}
.t tbody tr:last-child td{border-bottom:none;}
.t tfoot td{position:sticky;bottom:0;background:var(--surface-2);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);padding:10px 14px;}
.t tfoot b{color:var(--ink);font-variant-numeric:tabular-nums;}
.t .inativo td{color:var(--ink-3);}
.pessoa{display:flex;align-items:center;gap:10px;min-width:0;}
.pessoa b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;}
.pessoa small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;}
.pessoa>div{min-width:0;}
.mini-barra{position:relative;display:block;height:8px;min-width:90px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.mini-barra i{position:absolute;top:0;bottom:0;border-radius:999px;}

/* ----------------------------------------------------------- início */
.inicio-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin:16px 0 20px;}
.inicio-topo h1{margin:0;font-size:32px;line-height:1.08;font-weight:650;font-stretch:var(--larga);letter-spacing:-.015em;}
.inicio-topo .quando{margin-top:6px;color:var(--ink-2);font-size:14px;}
.inicio-topo .quando b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.inicio-grade{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px;align-items:start;}
.lista-av{display:flex;flex-direction:column;}
.av{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:12px 6px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);border-radius:10px;transition:background var(--d1);}
.av:last-child{border-bottom:none;}
.av:hover{background:var(--surface-2);}
.av .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c-soft,var(--surface-3));color:var(--c,var(--ink-2));}
.av .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.av>span:not(.ic):not(.qd){min-width:0;}
.av b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--ink);}
.av b+span{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-3);line-height:1.4;}
.av .qd{font-size:12px;color:var(--ink-3);white-space:nowrap;padding-top:2px;}
.av.erro{--c:var(--bad-ink);--c-soft:var(--bad-soft);}
.av.aviso{--c:var(--warn-ink);--c-soft:var(--warn-soft);}
.av.festa{--c:var(--festa);--c-soft:var(--festa-soft);}
.av.info{--c:var(--info-ink);--c-soft:var(--info-soft);}
.av.tarefa{--c:var(--brand-ink);--c-soft:var(--brand-soft);}
.av.entra{animation:sobe .4s var(--ease) both;}

.insight{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--brand-softer);border:1px solid var(--brand-soft);font-size:13px;color:var(--ink-2);line-height:1.5;}
.insight svg{width:17px;height:17px;flex:none;margin-top:1px;fill:none;stroke:var(--brand-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.insight b{color:var(--ink);}

/* agenda */
.tarefa{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;transition:opacity .3s,transform .3s var(--ease),border-color var(--d1),max-height .35s var(--ease),margin .35s var(--ease),padding .35s var(--ease);}
.tarefa:hover{border-color:var(--line-2);}
.tarefa.atrasada{box-shadow:inset 3px 0 0 var(--bad);}
.tarefa .tx{min-width:0;border:none;background:none;padding:0;text-align:left;color:var(--ink);}
.tarefa .tx b{display:block;font-weight:600;font-size:13.5px;line-height:1.35;}
.tarefa .tx small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tarefa .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:12.5px;color:var(--ink-3);white-space:nowrap;}
.tarefa.feita .tx b{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3);}
.tarefa.saindo{opacity:0;transform:translateX(16px);}
.ck{position:relative;width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0;color:#fff;transition:background var(--d2),border-color var(--d2);}
.ck:hover{border-color:var(--ok);}
.ck svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s;}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok);}
.ck[aria-checked="true"] svg{stroke-dashoffset:0;}
.ck svg{opacity:0;transition:stroke-dashoffset .3s var(--ease) .05s,opacity .1s;}
.ck[aria-checked="true"] svg{opacity:1;}
.ck.estoura{animation:estoura .4s var(--ease);}
@keyframes estoura{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.grupo-t{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:13px;font-weight:650;color:var(--ink-2);}
.grupo-t:first-child{margin-top:2px;}
.grupo-t i{font-style:normal;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);}
.grupo-t.atr{color:var(--bad-ink);}

/* ----------------------------------------------------------- colaboradores */
.visoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.visao{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;transition:border-color var(--d1),background var(--d1),color var(--d1);}
.visao:hover{color:var(--ink);border-color:var(--ink-3);}
.visao i{font-style:normal;min-width:24px;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);font-size:11.5px;text-align:center;}
.visao[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
.visao[aria-pressed="true"] i{background:rgba(255,255,255,.2);color:#fff;}
.visao.alerta i{background:var(--bad-soft);color:var(--bad-ink);}
.visao.alerta[aria-pressed="true"] i{background:#fff;color:var(--bad-ink);}
.resumo-pessoas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-bottom:16px;}
.resumo-pessoas>section{padding:12px 18px 10px;border-left:1px solid var(--line);min-width:0;}
.resumo-pessoas>section:first-child{border-left:none;}
.resumo-pessoas h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink-2);}
.filtro-ativo{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-size:12.5px;font-weight:600;border:none;}
.filtro-ativo svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;}
.cb{display:flex;flex-direction:column;gap:2px;}
.cb-l{display:grid;grid-template-columns:minmax(84px,1fr) minmax(0,1.6fr) 30px;align-items:center;gap:10px;width:100%;padding:2px 4px;border:none;background:none;border-radius:7px;text-align:left;font-size:12.5px;color:var(--ink-2);transition:background var(--d1);}
.cb-l:hover{background:var(--surface-2);color:var(--ink);}
.cb-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cb-l .t{height:9px;border-radius:0 4px 4px 0;background:transparent;}
.cb-l .t i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s1);transform-origin:left;animation:cresceX .6s var(--ease) both;}
.cb-l b{text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.cb-l.on{background:var(--brand-soft);color:var(--ink);}
.cb-l.fora{opacity:.45;}

/* gaveta (ficha, novo) */
.veu{position:fixed;inset:0;z-index:200;background:rgba(13,14,28,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity var(--d3) var(--ease);}
.veu.on{opacity:1;}
.gaveta{position:fixed;top:10px;right:10px;bottom:10px;z-index:210;width:min(640px,calc(100vw - 20px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-3);transform:translateX(calc(100% + 30px));transition:transform .45s var(--ease);overflow:hidden;}
.gaveta.on{transform:none;}
.gav-cab{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 16px;border-bottom:1px solid var(--line);}
.gav-cab .tit{flex:1;min-width:0;}
.gav-cab h2{margin:0;font-size:22px;line-height:1.2;font-weight:650;font-stretch:var(--larga);}
.gav-cab p{margin:4px 0 0;color:var(--ink-2);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.gav-corpo{flex:1;overflow:auto;padding:4px 22px 24px;overscroll-behavior:contain;}
.gav-pe{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);}
.gav-pe .msg{margin-right:auto;font-size:12.5px;color:var(--ink-3);}
.ficha-grade{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;}
.fc{padding:11px 0;border-bottom:1px solid var(--line);min-width:0;}
.fc .k{font-size:12px;color:var(--ink-3);}
.fc .v{margin-top:2px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sec-t{margin:22px 0 4px;font-size:13px;font-weight:650;color:var(--ink-2);}
.passos{display:flex;flex-direction:column;gap:18px;}
.passo{border:1px solid var(--line);border-radius:14px;padding:16px;}
.passo h3{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:14.5px;font-weight:650;}
.passo h3 i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);font-size:12px;font-weight:700;}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.campos .largo{grid-column:1/-1;}
.opcoes{display:flex;gap:6px;flex-wrap:wrap;}
.opcoes button{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);transition:all var(--d1);}
.opcoes button:hover{border-color:var(--ink-3);color:var(--ink);}
.opcoes button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}

/* modal */
.modal{position:fixed;inset:0;z-index:220;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;}
.modal-caixa{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-3);padding:20px 22px;pointer-events:auto;opacity:0;transform:translateY(10px) scale(.97);transition:opacity var(--d2),transform .35s var(--ease);}
.modal.on .modal-caixa{opacity:1;transform:none;}
.modal-caixa h2{margin:0 0 4px;font-size:20px;font-weight:650;font-stretch:var(--larga);}
.modal-caixa>p{margin:0 0 16px;color:var(--ink-2);font-size:13px;}
.modal-caixa .campo{margin-bottom:14px;}
.modal-pe{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px;}
.modal-pe .msg{margin-right:auto;font-size:12.5px;color:var(--ink-3);}
.fechar{position:relative;flex:none;}

/* paleta de comandos */
.cmd{position:fixed;inset:0;z-index:250;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;pointer-events:none;}
.cmd-caixa{width:min(620px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--sh-3);overflow:hidden;pointer-events:auto;opacity:0;transform:translateY(-8px) scale(.98);transition:opacity var(--d2),transform .3s var(--ease);}
.cmd.on .cmd-caixa{opacity:1;transform:none;}
.cmd-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);}
.cmd-in svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;}
.cmd-in input{flex:1;height:56px;border:none;background:none;outline:none;font-size:16px;color:var(--ink);}
.cmd-lista{max-height:min(420px,56vh);overflow:auto;padding:8px;}
.cmd-g{padding:8px 10px 4px;font-size:12px;font-weight:600;color:var(--ink-3);}
.cmd-it{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:none;background:none;border-radius:10px;text-align:left;color:var(--ink);font-size:13.5px;}
.cmd-it small{color:var(--ink-3);font-size:12.5px;margin-left:auto;white-space:nowrap;}
.cmd-it .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);flex:none;}
.cmd-it .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cmd-it[aria-selected="true"]{background:var(--brand-soft);}
.cmd-pe{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);}

/* menus suspensos (sino, usuário, criar) */
.suspenso{position:absolute;top:calc(100% + 8px);right:0;z-index:80;min-width:220px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--sh-2);padding:6px;transform-origin:top right;animation:pop .18s var(--ease);}
.suspenso.largo{width:min(380px,calc(100vw - 24px));padding:8px;}
.suspenso .op{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;border-radius:9px;text-align:left;font-size:13.5px;color:var(--ink);}
.suspenso .op:hover{background:var(--surface-2);}
.suspenso .op svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--ink-2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.suspenso .op small{display:block;color:var(--ink-3);font-size:12px;}
.suspenso hr{border:none;border-top:1px solid var(--line);margin:6px 4px;}
.suspenso .cab-s{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;}
.suspenso .cab-s b{display:block;font-size:14px;}
.rel{position:relative;}

/* toast */
.toasts{position:fixed;left:16px;right:16px;bottom:22px;z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
@media (max-width:860px){.toasts{bottom:90px;}}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13.5px;box-shadow:var(--sh-2);animation:toastIn .38s var(--ease) both;pointer-events:auto;max-width:calc(100vw - 32px);}
.toast svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.toast.ok svg{stroke:var(--ok);} .toast.erro svg{stroke:var(--bad);} .toast.aviso svg{stroke:var(--warn);}
.toast{max-width:min(560px,calc(100vw - 32px));line-height:1.45;}
.toast button{border:none;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0 0 0 6px;}
.toast.sai{animation:toastOut .25s var(--ease-in) both;}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* esqueleto de carregamento */
.esq{display:block;border-radius:8px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:brilho 1.2s linear infinite;}
@keyframes brilho{to{background-position:-200% 0}}
.recarregando{opacity:.55;transition:opacity var(--d2);}

/* ----------------------------------------------------------- folha */
.meses{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:18px;}
.mes{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;border:none;border-left:1px solid var(--line);background:none;font-size:13px;font-weight:600;color:var(--ink-2);transition:background var(--d1),color var(--d1);}
.mes:first-child{border-left:none;}
.mes:hover{background:var(--surface-2);color:var(--ink);}
.mes small{font-size:11px;font-weight:500;color:var(--ink-3);display:flex;align-items:center;gap:4px;}
.mes[aria-pressed="true"]{background:var(--brand);color:#fff;}
.mes[aria-pressed="true"] small{color:rgba(255,255,255,.75);}
.mes:disabled{cursor:default;color:var(--ink-3);opacity:.6;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px);}
.mes.ano{font-stretch:var(--semi);}
.heroi-folha{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-bottom:16px;}
.par{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;}
.par .n{display:flex;flex-direction:column;gap:2px;}
.par .n span{font-size:13px;color:var(--ink-2);font-weight:500;}
.par .n b{font-size:clamp(26px,2.35vw,36px);line-height:1.05;font-weight:620;font-stretch:104%;letter-spacing:-.02em;white-space:nowrap;}
.par .n small{font-size:12.5px;color:var(--ink-3);}
.par .seta{padding-bottom:30px;color:var(--ink-3);}
.par .seta svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.prop{display:flex;gap:2px;height:12px;margin:18px 0 8px;}
.prop i{display:block;height:100%;transform-origin:left;animation:cresceX .8s var(--ease) both;}
.prop i:first-child{border-radius:4px 0 0 4px;}
.prop i:last-child{border-radius:0 4px 4px 0;}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:none;border-left:1px solid var(--line);border-top:1px solid var(--line);background:none;text-align:left;min-width:0;transition:background var(--d1);}
.stat:nth-child(3n+1){border-left:none;}
.stat:nth-child(-n+3){border-top:none;}
button.stat:hover{background:var(--surface-2);}
.stat .k{font-size:12.5px;color:var(--ink-2);}
.stat .v{font-size:21px;font-weight:620;font-stretch:var(--semi);letter-spacing:-.01em;white-space:nowrap;}
.stat .s{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.cascata{display:flex;flex-direction:column;}
.cas{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(100px,1.5fr) auto;gap:14px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
.cas:last-child{border-bottom:none;}
.cas .r small{display:block;color:var(--ink-3);font-size:12px;}
.cas .tr{position:relative;height:14px;}
.cas .tr i{position:absolute;top:0;bottom:0;border-radius:3px;transform-origin:left;animation:cresceX .7s var(--ease) both;}
.cas .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:550;}
.cas.total{font-weight:650;}
.cas.total .tr{height:18px;}
.cas.total .v{font-weight:700;}
.grade-extrato{max-height:calc(100vh - 300px);overflow:auto;}
.grade-extrato table{min-width:1100px;}
.grade-extrato td:first-child,.grade-extrato th:first-child{position:sticky;left:0;z-index:3;background:var(--surface);min-width:230px;}
.grade-extrato th:first-child{background:var(--surface-2);z-index:4;}
.grade-extrato tr.grupo td{font-weight:650;color:var(--brand-ink);background:var(--surface);padding-top:16px;border-bottom:none;}
.grade-extrato td.tot,.grade-extrato th.tot{font-weight:650;background:var(--surface-2);}

/* ----------------------------------------------------------- férias / linha do tempo */
.regua{position:relative;}
.regua-escala{position:relative;height:34px;margin-left:220px;border-bottom:1px solid var(--line);}
.regua-escala .tk{position:absolute;bottom:0;width:1px;background:var(--line-2);}
.regua-escala .tk-mes{height:14px;background:var(--ink-3);}
.regua-escala .tk-sem{height:7px;}
.regua-escala span{position:absolute;bottom:16px;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;}
.regua-linhas{position:relative;}
.r-l{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:center;min-height:42px;border-bottom:1px solid var(--line);}
.r-l:last-child{border-bottom:none;}
.r-l .q{display:flex;align-items:center;gap:9px;padding-right:12px;min-width:0;border:none;background:none;text-align:left;color:var(--ink);}
.r-l .q b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.r-l .q small{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.r-l .q>div{min-width:0;}
.r-l .faixa{position:relative;height:42px;}
.r-bar{position:absolute;top:12px;height:18px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;transform-origin:left;animation:cresceX .7s var(--ease) both;}
.r-bar.ferias{background:var(--s3);}
.r-bar.exp{background:var(--brand-soft);color:var(--brand-ink);border:1px dashed color-mix(in srgb,var(--brand) 45%,transparent);}
.r-marco{position:absolute;top:9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid var(--surface);animation:pop .4s var(--ease) both;}
.r-marco.m45{background:var(--o2);color:#fff;}
.r-marco.m90{background:var(--brand);color:#fff;}
.r-marco.venc{background:var(--bad);color:#fff;}
.r-area{position:absolute;top:0;bottom:0;left:220px;right:0;pointer-events:none;}
.r-hoje{position:absolute;top:-6px;bottom:0;width:2px;margin-left:-1px;background:var(--accent);z-index:2;pointer-events:none;}
.r-hoje::before{content:'hoje';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--accent-ink);}

/* aniversariantes */
.ani-meses{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-bottom:18px;}
.ani-meses button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2);transition:all var(--d1);}
.ani-meses button small{font-size:11.5px;font-weight:500;color:var(--ink-3);}
.ani-meses button:hover{border-color:var(--ink-3);color:var(--ink);}
.ani-meses button[aria-pressed="true"]{background:var(--festa);border-color:var(--festa);color:#fff;}
.ani-meses button[aria-pressed="true"] small{color:rgba(255,255,255,.85);}
.ani-meses button.atual:not([aria-pressed="true"]){border-color:var(--festa);}
.cards-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.card-p{display:flex;flex-direction:column;gap:8px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);transition:border-color var(--d1),transform var(--d2) var(--ease);}
.card-p:hover{border-color:var(--line-2);transform:translateY(-1px);}
.card-p-abre{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:0;border:none;background:none;text-align:left;color:inherit;border-radius:10px;}
/* brinde de aniversário: alternar entregue / não entregue */
.brinde{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:6px 10px 6px 8px;border-radius:10px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:600;text-align:left;transition:background var(--d2),border-color var(--d2),color var(--d2);}
.brinde .r{white-space:nowrap;}
.brinde small{margin-left:auto;padding-left:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;font-weight:500;color:inherit;opacity:.8;white-space:nowrap;}
.brinde small:empty{display:none;}
.brinde .ckm{display:grid;place-items:center;width:18px;height:18px;flex:none;border-radius:6px;border:1.8px solid currentColor;color:inherit;opacity:.75;transition:background var(--d2),border-color var(--d2),opacity var(--d2);}
.brinde .ckm svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .32s var(--ease) .04s;}
.brinde:hover{border-color:var(--ok);color:var(--ink);}
.brinde.pendente{border-style:solid;border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:var(--warn-soft);color:var(--warn-ink);}
.brinde.hoje{border-style:solid;border-color:color-mix(in srgb,var(--festa) 50%,transparent);background:var(--festa-soft);color:var(--festa);}
.brinde.entregue{border-style:solid;border-color:transparent;background:var(--ok-soft);color:var(--ok-ink);}
.brinde.entregue .ckm{background:var(--ok);border-color:var(--ok);opacity:1;}
.brinde.entregue .ckm svg{stroke-dashoffset:0;}
.brinde:disabled{cursor:progress;}
/* adiantamentos: marcar desconto feito / recibo assinado (mesmo jeito do brinde) */
.chk-d{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:5px 10px 5px 8px;border-radius:10px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:600;text-align:left;white-space:nowrap;transition:background var(--d2),border-color var(--d2),color var(--d2);}
.chk-d .ckm{display:grid;place-items:center;width:18px;height:18px;flex:none;border-radius:6px;border:1.8px solid currentColor;opacity:.75;transition:background var(--d2),border-color var(--d2),opacity var(--d2);}
.chk-d .ckm svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .32s var(--ease) .04s;}
.chk-d small{font-size:11.5px;font-weight:500;opacity:.8;}
.chk-d:hover{border-color:var(--ok);color:var(--ink);}
.chk-d.atras{border-style:solid;border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:var(--warn-soft);color:var(--warn-ink);}
.chk-d.feito{border-style:solid;border-color:transparent;background:var(--ok-soft);color:var(--ok-ink);}
.chk-d.feito .ckm{background:var(--ok);border-color:var(--ok);opacity:1;}
.chk-d.feito .ckm svg{stroke-dashoffset:0;}
.chk-d:disabled{cursor:progress;opacity:.7;}
.ad-mes{display:flex;align-items:center;gap:6px;}
.ad-mes .inp{width:auto;min-width:170px;height:36px;}
.ad-bloco+.ad-bloco{margin-top:18px;}
.ad-bloco-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.ad-bloco-cab>div{display:flex;flex-direction:column;}
.ad-bloco-cab b{font-size:14.5px;font-weight:650;}
.ad-bloco-cab small{font-size:12.5px;color:var(--ink-3);}
.ad-tot{margin-left:auto;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;}
.ad-c-chk{width:230px;}
.ad-prog{display:block;width:96px;height:6px;margin:2px 0 4px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.ad-prog i{display:block;height:100%;border-radius:99px;background:var(--ok);}
.ad-parcelas{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.ad-p{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;}
.ad-p-n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-3);font-size:12px;font-weight:650;color:var(--ink-2);}
.ad-p b{display:block;font-size:14px;font-variant-numeric:tabular-nums;}
.ad-p small{display:block;font-size:12.5px;color:var(--ink-3);}
.ad-obs{margin:6px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);white-space:pre-wrap;}
.ad-info{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);}
.ad-info-p{display:flex;align-items:center;gap:10px;}
.ad-info-p b{display:block;}
.ad-info-p small{display:block;font-size:12.5px;color:var(--ink-3);}
.ad-info-n{display:flex;gap:8px 22px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);}
.ad-info-n b{display:block;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums;}
.ad-av{display:flex;align-items:flex-start;gap:8px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);font-size:12.5px;font-weight:550;}
.ad-av.info{background:var(--info-soft);color:var(--info-ink);}
.ad-info .ad-av{margin-top:0;}
.ad-av svg,.ad-ok svg,.ad-erro svg,.ad-feitas svg{width:15px;height:15px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.ad-plano{grid-template-columns:repeat(2,minmax(0,1fr));}
.ad-linhas td{padding-top:6px;padding-bottom:6px;}
.ad-linhas .inp{height:34px;}
.ad-linhas input.inp{width:110px;text-align:right;}
.ad-soma{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;}
.ad-ok,.ad-erro{display:inline-flex;align-items:center;gap:6px;font-weight:600;}
.ad-ok{color:var(--ok-ink);}
.ad-erro{color:var(--bad-ink);}
.ad-feitas{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.ad-feitas div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok-ink);}
.ad-feitas small{color:var(--ink-3);margin-left:auto;}
.lnk{border:none;background:none;padding:0;color:var(--brand-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
.insight.ruim{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);}
.insight.ruim svg{stroke:var(--bad-ink);}
/* recibo do vale adiantamento: só existe na impressão (A4 em pé, igual ao modelo da empresa) */
#impressao{display:none;}
.an-resumo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.card-p .dia{width:48px;height:48px;border-radius:12px;background:var(--surface-3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.card-p .dia b{font-size:19px;font-weight:700;font-stretch:var(--semi);}
.card-p .dia small{font-size:10.5px;font-weight:600;color:var(--ink-3);margin-top:3px;}
.card-p.hoje .dia{background:var(--festa);color:#fff;}
.card-p.hoje .dia small{color:rgba(255,255,255,.85);}
.card-p.passou .card-p-abre{opacity:.55;}
.card-p b.nm{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-p small.sb{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* armários */
.armarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;}
.arm{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:92px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--ink);transition:border-color var(--d1),transform var(--d2) var(--ease),box-shadow var(--d2);animation:pop .35s var(--ease) both;}
.arm:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--sh-2);}
.arm .nr{font-size:20px;font-weight:650;font-stretch:var(--larga);line-height:1;}
.arm .q{font-size:12px;color:var(--ink-2);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.arm .st{position:absolute;top:10px;right:10px;}
.arm.livre{background:var(--surface-2);border-style:dashed;}
.arm.livre .q{color:var(--ink-3);}
.arm.pend{border-color:color-mix(in srgb,var(--warn) 60%,transparent);}

/* mapa da fábrica */
.mapa{display:grid;gap:8px;}
.mapa-l{display:grid;align-items:stretch;gap:8px;}
.mapa-cab{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0 2px;display:flex;align-items:flex-end;}
.mapa-turno{display:flex;flex-direction:column;justify-content:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:650;}
.mapa-turno small{font-size:11.5px;font-weight:500;color:var(--ink-3);}
.cel{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:8px 10px 8px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--ink);font-size:12.5px;overflow:hidden;transition:border-color var(--d1),transform var(--d2) var(--ease),box-shadow var(--d2);}
.cel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line-2));}
.cel:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh-2);}
.cel b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cel small{color:var(--ink-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cel.vaga{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--surface-2) 7px 8px);color:var(--ink-3);border-style:dashed;}
.cel.ativo{--c:var(--ok);} .cel.exp{--c:var(--brand);} .cel.ferias{--c:var(--s3);} .cel.afast{--c:var(--bad);}
.cel.arrastando{opacity:.4;}
.cel.alvo{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}

/* histórico */
.hist-dia{margin:18px 0 8px;font-size:13px;font-weight:650;color:var(--ink-2);}
.hist-dia:first-child{margin-top:0;}
.ev{display:grid;grid-template-columns:52px 34px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;}
.ev .hr{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:7px;}
.ev .tx{font-size:13.5px;min-width:0;}
.ev .tx em{font-style:normal;font-weight:600;color:var(--c,var(--ink));}
.ev .mud{margin-top:4px;font-size:12.5px;color:var(--ink-3);}
.ev .mud s{text-decoration-color:var(--bad);}
.ev .mud b{color:var(--ink);font-weight:600;}
.ev .aud-mais{margin-top:6px;font-size:12.5px;color:var(--ink-2);}
.ev .aud-mais summary{cursor:pointer;color:var(--brand-ink);font-weight:600;width:max-content;}
.ev .aud-mais > div{padding:6px 0;border-top:1px solid var(--line);}
.ev .aud-mais > div:first-of-type{margin-top:6px;}

/* configurações */
.conf{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start;}
.conf-nav{display:flex;flex-direction:column;gap:2px;padding:6px;}
.conf-nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:none;border-radius:9px;background:none;text-align:left;font-size:13.5px;font-weight:600;color:var(--ink-2);}
.conf-nav button:hover{background:var(--surface-2);color:var(--ink);}
.conf-nav button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);}
.conf-l{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.conf-l:last-child{border-bottom:none;}
.conf-l b{display:block;font-weight:600;font-size:13.5px;}
.conf-l small{display:block;color:var(--ink-3);font-size:12.5px;}
.conf-l .inp{text-align:right;}
.conf-nav button{white-space:nowrap;flex:none;}
.conf-l.tu-l{grid-template-columns:minmax(0,1fr) auto auto;}
.tu-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
@media (max-width:600px){.conf-l.tu-l{grid-template-columns:minmax(0,1fr) auto;row-gap:8px;}.tu-tags{grid-column:1 / -1;grid-row:2;justify-content:flex-start;}}

/* botão flutuante + (ações rápidas) */
.fab{position:fixed;right:24px;bottom:24px;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
.fab-btn{width:58px;height:58px;border-radius:18px;border:none;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 16px 30px -12px var(--brand),0 4px 12px rgba(23,25,54,.18);transition:transform .25s var(--ease),background var(--d1),border-radius .35s var(--ease);}
.fab-btn:hover{background:var(--brand-hover);transform:translateY(-2px);}
.fab-btn:active{transform:scale(.95);}
.fab-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;transition:transform .35s var(--ease);}
.fab.on .fab-btn{border-radius:50%;}
.fab.on .fab-btn svg{transform:rotate(135deg);}
/* painel do +: ações rápidas e o mesmo menu do lado; item com submenu abre o segundo nível aqui dentro */
.fab-menu{position:absolute;right:0;bottom:72px;width:min(560px,calc(100vw - 48px));max-height:calc(100vh - 118px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-3);padding:14px;transform-origin:100% 100%;animation:fabP .24s var(--ease) both;}
.fab-menu.nivel2{width:min(340px,calc(100vw - 48px));}
@keyframes fabP{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.fab-p{animation:fabC .2s var(--ease) both;}
.fab-p.n2{animation-name:fabC2;}
@keyframes fabC{from{opacity:0}to{opacity:1}}
@keyframes fabC2{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.fab-sec{margin:2px 4px 8px;font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);}
.fab-sec:not(:first-child){margin-top:16px;}
.fab-acoes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
.fab-a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px 9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;line-height:1.25;text-align:center;transition:border-color var(--d1),background var(--d1),transform var(--d2) var(--ease);}
.fab-a:hover,.fab-a:focus-visible{border-color:var(--brand);background:var(--brand-softer);transform:translateY(-1px);}
.fab-a .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);}
.fab-a.dest .ic{background:var(--accent);color:#2a1503;}
.fab-a svg,.fab-l svg,.fab-volta svg,.fab-topo b svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.fab-nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px;}
.fab-g{margin:12px 10px 4px;font-size:11.5px;font-weight:600;color:var(--ink-3);}
.fab-col>div:first-child>.fab-g{margin-top:2px;}
.fab-l{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 8px;border:none;border-radius:10px;background:none;color:var(--ink);font-size:13.5px;font-weight:550;text-align:left;transition:background var(--d1),color var(--d1);}
.fab-l:hover,.fab-l:focus-visible{background:var(--surface-2);}
.fab-l.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:650;}
.fab-l .ic{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:8px;color:var(--ink-2);}
.fab-l.on .ic{color:var(--brand-ink);}
.fab-l .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fab-l em{font-style:normal;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);}
.fab-l em.alerta{background:var(--accent);color:#1d1203;}
.fab-seta{display:grid;place-items:center;flex:none;color:var(--ink-3);transition:transform var(--d2) var(--ease),color var(--d1);}
.fab-l:hover .fab-seta,.fab-l:focus-visible .fab-seta{color:var(--brand);transform:translateX(2px);}
.fab-l.sub{padding-left:14px;}
.fab-l.acao .ic{background:var(--brand-soft);color:var(--brand-ink);}
.fab-topo{display:flex;align-items:center;gap:10px;margin:0 0 4px;}
.fab-topo b{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:650;}
.fab-topo b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fab-volta{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;flex:none;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;}
.fab-volta:hover,.fab-volta:focus-visible{border-color:var(--brand);color:var(--brand-ink);}
body.gaveta-aberta .fab{opacity:0;pointer-events:none;}
@keyframes desenha{to{stroke-dashoffset:0}}
.selo-topo{flex:none;}

/* ----------------------------------------------------------- responsivo */
@media (max-width:1280px){
  .inicio-grade{grid-template-columns:minmax(0,1fr) 300px;}
  .kpi > .spark{display:none;}
  /* sem espaço ao lado do número: a sparkline desce para baixo dele em vez de sumir */
  .kpi .spark-hit{position:static;margin:4px 0 -6px -8px;}
}
@media (max-width:560px){ .kpi .spark-hit{display:none;} }
@media (max-width:1100px){
  .g-2-1,.g-3-2,.inicio-grade,.heroi-folha{grid-template-columns:minmax(0,1fr);}
