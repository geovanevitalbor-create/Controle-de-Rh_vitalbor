/* =====================================================================
   TELA · FÉRIAS E EXPERIÊNCIA — linha do tempo dos próximos 90 dias,
   saldo por pessoa, decisões de experiência e o agendamento de férias
   ===================================================================== */
/* feriados nacionais (fixos + Sexta-feira Santa, calculada pela Páscoa) do ano
   passado até daqui a 2 anos: as férias não podem começar nos 2 dias antes deles */
const FERIADOS = (function () {
  const pascoa = y => { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1; return y + '-' + String(mes).padStart(2, '0') + '-' + String(dia).padStart(2, '0'); };
  const y0 = new Date().getFullYear(), L = [];
  for (let y = y0 - 1; y <= y0 + 2; y++) { ['01-01', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'].forEach(md => L.push(y + '-' + md)); L.push(Dt.soma(pascoa(y), -2)); }
  return L.sort();
})();

Telas.ferias = (function () {
  const st = { aba: 'linha', filtro: 'agendar', q: '' };
  let P = [];
  const at = () => P.filter(p => p.situacao_ref === 'Ativo' || p.situacao_ref === 'Afastado');
  const URG = { vencida: 0, vencendo: 1, pendente: 2, agendada: 3, em_andamento: 4, ok: 5, sem_direito: 6 };
  const tagEstado = f => ({ vencida: '<span class="tag bad">' + ic('alerta') + 'vencidas</span>', vencendo: '<span class="tag warn">vencem em ' + f.diasLimite + 'd</span>', pendente: '<span class="tag">pendente · ' + f.diasLimite + 'd de prazo</span>', agendada: '<span class="tag brand">agendadas</span>', em_andamento: '<span class="tag info">' + ic('praia') + 'de férias</span>', ok: '<span class="tag ok">em dia</span>', sem_direito: '<span class="tag">ainda sem direito</span>' })[f.estado] || '';

  // ------------------------------------------------------------ linha do tempo
  function linhaDoTempo() {
    const hoje = Dt.hoje(), ini = Dt.soma(hoje, -7), fim = Dt.soma(hoje, 90), total = Dt.entre(ini, fim);
    const x = d => Math.max(0, Math.min(100, Dt.entre(ini, d) / total * 100));
    const linhas = [];
    at().forEach(p => {
      const evs = [];
      p.ferias_info.historico.forEach(f => { const ff = Regras.fimFerias(f.inicio, f.dias); if (ff >= ini && f.inicio <= fim) evs.push({ t: 'ferias', de: f.inicio, ate: ff, f }); });
      if (p.exp && (p.exp.fim90 >= ini)) evs.push({ t: 'exp', de: p.admissao, ate: p.exp.fim90, p });
      if (evs.length) linhas.push({ p, evs, ord: Math.min.apply(null, evs.map(e => Dt.entre(hoje, e.t === 'exp' ? (p.exp.estado === 'sem_decisao' ? Dt.soma(hoje, -99) : p.exp.proximoMarco) : e.de))) });
    });
    linhas.sort((a, b) => a.ord - b.ord);
    // régua: meses e segundas-feiras
    let regua = '';
    for (let d = ini; d <= fim; d = Dt.soma(d, 1)) {
      const dd = Dt.de(d);
      if (dd.getDate() === 1) regua += '<i class="tk tk-mes" style="left:' + x(d) + '%"></i><span style="left:' + Math.min(96, x(d) + 4) + '%">' + MESES[dd.getMonth()] + '</span>';
      else if (dd.getDay() === 1) regua += '<i class="tk tk-sem" style="left:' + x(d) + '%"></i>';
    }
    if (Dt.de(ini).getDate() > 1) regua += '<span style="left:' + Math.min(10, (Dt.entre(ini, Dt.fimDoMes(Dt.comp(ini))) / total * 50)) + '%">' + MESES[Dt.de(ini).getMonth()] + '</span>';
    const lin = linhas.map((l, k) => {
      const p = l.p;
      const barras = l.evs.map(e => {
        if (e.t === 'ferias') { const w = x(e.ate) - x(e.de) + (100 / total); return '<span class="r-bar ferias" style="left:' + x(e.de) + '%;width:' + w + '%;animation-delay:' + (k * 40) + 'ms" data-dica="' + esc('Férias de ' + Fmt.data(e.de) + ' a ' + Fmt.data(e.ate) + ' · ' + e.f.dias + ' dias' + (e.f.abono ? ' + 10 vendidos' : '') + (e.de > hoje ? ' · pagar até ' + Fmt.data(Regras.pagarAte(e.de)) : '')) + '">' + (w > 9 ? e.f.dias + ' dias' : '') + '</span>'; }
        const ex = p.exp, sd = ex.estado === 'sem_decisao';
        let h = '<span class="r-bar exp" style="left:' + x(e.de) + '%;width:' + (x(e.ate) - x(e.de)) + '%;animation-delay:' + (k * 40) + 'ms" data-dica="' + esc('Experiência: admissão ' + Fmt.data(p.admissao) + ' · 45 dias em ' + Fmt.data(ex.fim45) + ' · 90 dias em ' + Fmt.data(ex.fim90)) + '"></span>';
        if (ex.fim45 >= ini) h += '<span class="r-marco m45" style="left:' + x(ex.fim45) + '%" data-dica="' + esc('45 dias: ' + Fmt.data(ex.fim45) + ' — prorrogar ou desligar') + '">45</span>';
        h += '<span class="r-marco ' + (sd ? 'venc' : 'm90') + '" style="left:' + x(ex.fim90) + '%" data-dica="' + esc((sd ? 'Terminou em ' : '90 dias: ') + Fmt.data(ex.fim90) + (sd ? ' sem decisão registrada' : ' — efetivar ou desligar')) + '">' + (sd ? '!' : '90') + '</span>';
        return h;
      }).join('');
      return '<div class="r-l"><button type="button" class="q" data-ficha="' + p.id + '">' + UI.avatar(p.nome) + '<div><b>' + esc(Fmt.primeiroUltimo(p.nome)) + '</b><small>' + esc(p.setor) + ' · ' + esc(p.turno_nome) + '</small></div></button><div class="faixa">' + barras + '</div></div>';
    }).join('');
    return '<section class="painel"><div class="painel-cab"><div><h2>Próximos 90 dias</h2><span class="sub">Férias e marcos de experiência. Passe o mouse para ver as datas.</span></div><div class="legenda"><span class="it"><i class="sw" style="background:var(--s3)"></i>Férias</span><span class="it"><i class="sw" style="background:var(--brand-soft);border:1px dashed var(--brand)"></i>Experiência</span><span class="it"><i class="sw" style="background:var(--o2);border-radius:50%"></i>45 dias</span><span class="it"><i class="sw" style="background:var(--brand);border-radius:50%"></i>90 dias</span></div></div>' +
      '<div class="painel-corpo"><div class="regua"><div class="regua-escala">' + regua + '</div><div class="regua-linhas" style="position:relative">' + (lin || UI.vazio('Nada nos próximos 90 dias')) +
      '<div class="r-area"><span class="r-hoje" style="left:' + x(hoje) + '%"></span></div></div></div></div></section>';
  }

  // ------------------------------------------------------------ férias por pessoa
  function porPessoa() {
    const q = norm(st.q);
    let L = at().filter(p => p.ferias_info.estado !== 'sem_direito' || st.filtro === 'todos');
    if (st.filtro === 'agendar') L = L.filter(p => ['vencida', 'vencendo', 'pendente'].includes(p.ferias_info.estado));

    L.sort((a, b) => (URG[a.ferias_info.estado] - URG[b.ferias_info.estado]) || ((a.ferias_info.diasLimite || 999) - (b.ferias_info.diasLimite || 999)));
    return '<section class="painel" style="overflow:hidden"><div class="painel-cab" style="padding-bottom:12px"><div class="filtros" style="margin:0;flex:1">' + UI.seg('fe-filtro', [{ v: 'agendar', rot: 'Precisam agendar' }, { v: 'todos', rot: 'Todos' }], st.filtro, 'sm') +
      '<label class="busca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><input class="inp" id="fe-q" type="search" placeholder="Buscar pessoa ou setor" value="' + esc(st.q) + '"></label><span class="conta">' + L.length + ' pessoa' + (L.length === 1 ? '' : 's') + '</span></div></div>' +
      '<div class="tabela-caixa alta"><table class="t"><thead><tr><th><span>Pessoa</span></th><th><span>Período aquisitivo</span></th><th class="n"><span>Saldo</span></th><th><span>Conceder até</span></th><th><span>Situação</span></th><th><span></span></th></tr></thead><tbody>' +
      (L.length ? L.map(p => { const f = p.ferias_info, a = f.alvo; return '<tr data-abrir="' + p.id + '"><td><div class="pessoa">' + UI.avatar(p.nome) + '<div><b>' + esc(p.nome) + '</b><small>' + esc(p.setor) + ' · ' + esc(p.turno_nome) + '</small></div></div></td><td class="num">' + (a ? Fmt.data(a.ini) + ' a ' + Fmt.data(a.fim) : f.periodos.length ? '<span class="dim">até ' + Fmt.data(f.periodos[f.periodos.length - 1].fim) + '</span>' : '—') + '</td><td class="n">' + (a ? a.saldo + ' dias' : '—') + '</td><td class="num">' + (a ? Fmt.data(a.limite) : '—') + '</td><td>' + tagEstado(f) + (f.proximas.length ? ' <span class="dim">' + Fmt.dataCurta(f.proximas[0].inicio) + '</span>' : '') + '</td><td class="n">' + (a && f.estado !== 'em_andamento' ? (p.situacao_ref === 'Ativo' ? '<button class="btn btn-sec btn-sm" type="button" data-so-editor data-agendar="' + p.id + '">' + ic('praia') + 'Agendar</button>' : '<span class="tag" data-dica="Afastado: as férias só podem ser marcadas depois do retorno">afastado</span>') : '') + '</td></tr>'; }).join('')
        : '<tr><td colspan="6">' + UI.vazio('Ninguém precisa agendar férias agora', 'Todos estão com as férias em dia ou já agendadas.') + '</td></tr>') + '</tbody></table></div></section>';
  }

  // ------------------------------------------------------------ experiência
  function experiencia() {
    const E = at().filter(p => p.exp);
    const grupo = (tit, sub, L, cls) => '<section class="painel"><div class="painel-cab"><div><h2>' + esc(tit) + ' <span class="tag ' + cls + '" style="margin-left:6px">' + L.length + '</span></h2><span class="sub">' + esc(sub) + '</span></div></div><div class="painel-corpo" style="display:flex;flex-direction:column;gap:10px">' +
      (L.length ? L.map(p => {
        const ex = p.exp, dias = Dt.entre(p.admissao, Dt.hoje()), pct = Math.min(100, dias / 90 * 100);
        return '<div class="passo" style="padding:12px 14px"><div class="pessoa" style="margin-bottom:10px">' + UI.avatar(p.nome) + '<div><b>' + esc(p.nome) + '</b><small>' + esc(p.funcao) + ' · admissão ' + Fmt.data(p.admissao) + '</small></div></div>' +
          '<div style="position:relative;height:8px;border-radius:999px;background:var(--surface-3);margin:6px 0 4px"><i style="position:absolute;left:0;top:0;bottom:0;width:' + pct + '%;border-radius:999px;background:' + (ex.estado === 'sem_decisao' ? 'var(--bad)' : 'var(--brand)') + ';transform-origin:left;animation:cresceX .8s var(--ease) both"></i><i style="position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--surface);"></i></div>' +
          '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)"><span>dia ' + Math.min(dias, 999) + '</span><span>45 dias · ' + Fmt.dataCurta(ex.fim45) + '</span><span>90 dias · ' + Fmt.dataCurta(ex.fim90) + '</span></div>' +
          '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' + (ex.estado === 'sem_decisao' || ex.faltamMarco <= 15 ? '<button class="btn btn-ok btn-sm" type="button" data-so-editor data-dec="efetivar" data-id="' + p.id + '">' + ic('check') + 'Efetivar</button><button class="btn btn-perigo btn-sm" type="button" data-so-editor data-dec="desligar" data-id="' + p.id + '">Desligar</button>' : '') + '<button class="btn btn-ghost btn-sm" type="button" data-ficha="' + p.id + '">Abrir ficha</button></div></div>';
      }).join('') : UI.vazio('Ninguém aqui')) + '</div></section>';
    const sem = E.filter(p => p.exp.estado === 'sem_decisao'), prox = E.filter(p => p.exp.estado === 'em' && p.exp.faltamMarco <= 15), and = E.filter(p => p.exp.estado === 'em' && p.exp.faltamMarco > 15);
    return '<div class="grade g-3">' + grupo('Terminou sem decisão', 'o prazo passou e ninguém registrou', sem, 'bad') + grupo('Decidir em até 15 dias', 'marco de 45 ou de 90 dias chegando', prox, 'warn') + grupo('Em andamento', 'ainda com folga', and, 'brand') + '</div>';
  }

  function desenharAba() {
    const c = document.getElementById('fe-corpo');
    c.innerHTML = st.aba === 'linha' ? linhaDoTempo() : st.aba === 'pessoas' ? porPessoa() : experiencia();
    c.style.animation = 'none'; void c.offsetWidth; c.style.animation = 'sobe .32s var(--ease) both';
    if (st.aba === 'pessoas') {
      UI.ligarSeg('fe-filtro', v => { st.filtro = v; desenharAba(); });
      let t = 0; document.getElementById('fe-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; const pos = e.target.selectionStart; desenharAba(); const i = document.getElementById('fe-q'); i.focus(); i.setSelectionRange(pos, pos); }, 200); });
    }
  }
  async function render(el, params) {
    if (params.aba) st.aba = params.aba === 'experiencia' ? 'exp' : params.aba === 'ferias' ? 'pessoas' : params.aba;
    if (!Store.tem('pessoas')) el.innerHTML = UI.esqueleto(6);
    P = await D.pessoas();
    const A = at(), hoje = Dt.hoje();
    const andamento = A.filter(p => p.ferias_info.andamento).length, prox = A.filter(p => p.ferias_info.proximas.some(f => f.inicio <= Dt.soma(hoje, 90))).length;
    // (não chamar de "agendar": esse nome é a função que abre a gaveta)
    const nAgendar = A.filter(p => ['vencida', 'vencendo'].includes(p.ferias_info.estado)).length, venc = A.filter(p => p.ferias_info.estado === 'vencida').length;
    const emExp = A.filter(p => p.exp).length, decidir = A.filter(p => p.exp && (p.exp.estado === 'sem_decisao' || p.exp.faltamMarco <= 15)).length;
    el.innerHTML = '<div id="fe-wrap"><div class="cab"><div><h1>Férias e experiência</h1><p>Quem está de férias, quem precisa agendar e as decisões de experiência que estão chegando.</p></div><div class="cab-acoes"><button class="btn btn-pri" type="button" id="fe-agendar" data-so-editor>' + ic('praia') + 'Agendar férias</button></div></div>' +
      '<section class="kpis" style="margin-bottom:18px">' +
        '<button class="kpi" type="button" data-aba="linha"><span class="k">De férias agora</span><span class="v">' + andamento + '</span><span class="s">' + prox + ' com férias nos próximos 90 dias</span></button>' +
        '<button class="kpi" type="button" data-aba="pessoas"><span class="k">Precisam agendar</span><span class="v">' + nAgendar + '</span><span class="s">' + (venc ? '<span class="tag bad">' + venc + ' vencida' + (venc > 1 ? 's' : '') + '</span>' : '') + 'prazo em até ' + Base.PARAM.aviso_ferias + ' dias</span></button>' +
        '<button class="kpi" type="button" data-aba="exp"><span class="k">Em experiência</span><span class="v">' + emExp + '</span><span class="s">contrato de 45 + 45 dias</span></button>' +

      '</section>' +
      UI.abas('fe-abas', [{ v: 'linha', rot: 'Próximos 90 dias' }, { v: 'pessoas', rot: 'Férias por pessoa', n: nAgendar || '' }, { v: 'exp', rot: 'Experiência', n: decidir || '' }], st.aba) + '<div id="fe-corpo"></div></div>';
    UI.ligarAbas('fe-abas', v => { st.aba = v; trocarUrl('#/ferias?aba=' + v); desenharAba(); });
    desenharAba();
    const w = document.getElementById('fe-wrap');
    w.addEventListener('click', async e => {
      const k = e.target.closest('.kpi[data-aba]'); if (k) { const b = document.querySelector('#fe-abas button[data-v="' + k.dataset.aba + '"]'); if (b) b.click(); return; }
      const ag = e.target.closest('[data-agendar]'); if (ag) { e.stopPropagation(); agendar(ag.dataset.agendar); return; }
      const fi = e.target.closest('[data-ficha]'); if (fi) { Telas.colaboradores.ficha(fi.dataset.ficha, 'ferias'); return; }
      const d = e.target.closest('[data-dec]'); if (d) { d.disabled = true; try { await API.colaboradores.decidirExperiencia(d.dataset.id, d.dataset.dec); } catch (x) { UI.toast(x.message, 'erro'); d.disabled = false; return; } D.mudou('pessoas'); UI.toast(d.dataset.dec === 'efetivar' ? 'Efetivação registrada' : 'Desligamento registrado'); App.mostrar(); return; }
      const tr = e.target.closest('tr[data-abrir]'); if (tr) Telas.colaboradores.ficha(tr.dataset.abrir, 'ferias');
    });
    w.addEventListener('pointerover', e => { const t = e.target.closest('[data-dica]'); if (!t) return; const r = t.getBoundingClientRect(); Graf.Dica.mostrar('<div class="t">' + esc(t.dataset.dica) + '</div>', r.left + r.width / 2, r.top - 10); });
    w.addEventListener('pointerout', e => { if (e.target.closest('[data-dica]')) Graf.Dica.esconder(); });
    document.getElementById('fe-agendar').addEventListener('click', () => agendar());
  }

  // por que não dá para agendar (o motivo certo para cada caso)
  function semAgendar(p) {
    if (!p) return 'Pessoa não encontrada';
    const n = Fmt.primeiroUltimo(p.nome), e = p.ferias_info.estado;
    if (p.situacao_ref === 'Afastado') return n + ' está afastado(a): as férias só podem ser marcadas depois do retorno';
    if (p.situacao_ref === 'Inativo') return n + ' não está mais na empresa';
    if (e === 'em_andamento') return n + ' está de férias agora';
    if (e === 'sem_direito') return n + ' ainda não completou 12 meses de casa: não há férias para agendar';
    return 'As férias de ' + n + ' estão em dia: o período atual já foi gozado ou agendado';
  }
  // ------------------------------------------------------------ agendar férias (gaveta)
  async function agendar(idPessoa) {
    if (!App.editor()) { UI.toast('O seu perfil só consulta: quem agenda férias é o RH', 'aviso'); return; }
    P = await D.pessoas();
    const A = at().filter(p => p.situacao_ref === 'Ativo' && p.ferias_info.alvo).sort((a, b) => (URG[a.ferias_info.estado] - URG[b.ferias_info.estado]) || ((a.ferias_info.diasLimite || 999) - (b.ferias_info.diasLimite || 999)));
    const urg = A.filter(p => ['vencida', 'vencendo', 'pendente'].includes(p.ferias_info.estado)), resto = A.filter(p => !urg.includes(p));
    if (idPessoa && !A.find(p => p.id === idPessoa)) { UI.toast(semAgendar(P.find(x => x.id === idPessoa)), 'aviso'); return; }
    const sel = idPessoa || (urg[0] || A[0] || {}).id;
    const opt = p => '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.nome) + ' — saldo ' + p.ferias_info.alvo.saldo + 'd, até ' + Fmt.dataCurta(p.ferias_info.alvo.limite) + '</option>';
    const segunda = iso => { let d = iso; while (Dt.de(d).getDay() !== 1) d = Dt.soma(d, 1); return d; };
    const html = '<div class="gav-cab"><div class="tit"><h2 id="gav-titulo">Agendar férias</h2><p>Escolha a pessoa, o início e quantos dias. As regras da CLT são conferidas na hora.</p></div><button class="btn btn-ghost btn-ico fechar" type="button" data-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
      '<div class="gav-corpo"><div class="passos" style="padding-top:14px">' +
        '<section class="passo"><h3><i>1</i>Quem sai de férias</h3><div class="campo"><label for="ag-p">Pessoa</label><select id="ag-p">' + (urg.length ? '<optgroup label="Precisam agendar (mais urgentes primeiro)">' + urg.map(opt).join('') + '</optgroup>' : '') + (resto.length ? '<optgroup label="Demais com saldo">' + resto.map(opt).join('') + '</optgroup>' : '') + '</select></div><div id="ag-info" style="margin-top:12px"></div></section>' +
        '<section class="passo"><h3><i>2</i>Quando e quantos dias</h3><div class="campos">' +
          '<div class="campo"><label for="ag-ini">Início</label><input id="ag-ini" type="date"><span class="dica" id="ag-ini-h"></span></div>' +
          '<div class="campo"><span class="rotulo">Dias de férias</span><div class="opcoes" id="ag-dias">' + [30, 20, 15, 14, 10, 5].map(d => '<button type="button" data-v="' + d + '" aria-pressed="' + (d === 30) + '">' + d + '</button>').join('') + '</div></div>' +
          '<label class="chk largo"><input type="checkbox" id="ag-abono"> Vender 10 dias (abono pecuniário)</label>' +
        '</div><div id="ag-vis" style="margin-top:16px"></div></section>' +
        '<section class="passo" id="ag-regras-c"><h3><i>3</i>Conferência</h3><div id="ag-regras"></div></section>' +
      '</div></div>' +
      '<div class="gav-pe"><span class="msg" id="ag-msg"></span><button class="btn btn-ghost" type="button" data-fechar>Cancelar</button><button class="btn btn-pri" type="button" id="ag-ok">' + ic('check') + 'Agendar férias</button></div>';
    const g = UI.abrirGaveta(html);
    const $a = id => document.getElementById(id);
    let dias = 30;
    const pessoa = () => P.find(p => p.id === $a('ag-p').value);
    function sugerirInicio() {
      const p = pessoa(); if (!p) return;
      let d = segunda(Dt.soma(Dt.hoje(), 31));
      const lim = p.ferias_info.alvo.limite;
      if (Regras.fimFerias(d, 30) > lim) d = segunda(Dt.soma(Dt.hoje(), 3));
      $a('ag-ini').value = d;
    }
    function atualizar() {
      const p = pessoa(); if (!p) return;
      const f = p.ferias_info, a = f.alvo, abono = $a('ag-abono').checked, ini = $a('ag-ini').value;
      const ult = f.historico.filter(x => x.inicio <= Dt.hoje()).slice(-1)[0];
      $a('ag-info').innerHTML = '<div class="ficha-grade">' +
        '<div class="fc"><div class="k">Período aquisitivo</div><div class="v">' + Fmt.data(a.ini) + ' a ' + Fmt.data(a.fim) + '</div></div>' +
        '<div class="fc"><div class="k">Saldo</div><div class="v"><b>' + a.saldo + ' dias</b></div></div>' +
        '<div class="fc"><div class="k">Conceder até</div><div class="v">' + Fmt.data(a.limite) + ' ' + tagEstado(f) + '</div></div>' +
        '<div class="fc"><div class="k">Últimas férias</div><div class="v">' + (ult ? Fmt.data(ult.inicio) + ' · ' + ult.dias + ' dias' : 'nenhuma lançada') + '</div></div></div>';
      $a('ag-ini-h').textContent = ini ? Dt.semana(ini) + ' · avisar até ' + Fmt.data(Dt.soma(ini, -30)) : '';
      const fimF = ini ? Regras.fimFerias(ini, dias) : null, volta = fimF ? Dt.soma(fimF, 1) : null;
      // barra: hoje → prazo para conceder, com o período escolhido
      const de = Dt.hoje(), ate = a.limite > Dt.soma(de, 60) ? a.limite : Dt.soma(de, 120), tot = Math.max(1, Dt.entre(de, ate));
      const px = d => Math.max(0, Math.min(100, Dt.entre(de, d) / tot * 100));
      $a('ag-vis').innerHTML = ini ? '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px">' +
          '<div><div class="rotulo">Sai em</div><div style="font-size:18px;font-weight:650;font-stretch:var(--semi)">' + Dt.semana(ini).slice(0, 3) + ', ' + Fmt.dataCurta(ini) + '</div></div>' +
          '<div><div class="rotulo">Volta em</div><div style="font-size:18px;font-weight:650;font-stretch:var(--semi)">' + Dt.semana(volta).slice(0, 3) + ', ' + Fmt.dataCurta(volta) + '</div></div>' +
          '<div><div class="rotulo">Pagar até</div><div style="font-size:18px;font-weight:650;font-stretch:var(--semi)">' + Fmt.dataCurta(Regras.pagarAte(ini)) + '</div></div></div>' +
        '<div style="position:relative;height:30px;border-radius:9px;background:var(--surface-3);overflow:hidden"><span style="position:absolute;top:0;bottom:0;left:' + px(ini) + '%;width:' + Math.max(1.5, px(fimF) - px(ini)) + '%;background:var(--s3);border-radius:6px;transition:left .35s var(--ease),width .35s var(--ease)"></span>' + (a.limite <= ate ? '<span style="position:absolute;top:0;bottom:0;left:' + px(a.limite) + '%;width:2px;background:var(--bad)"></span>' : '') + '</div>' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:5px"><span>hoje</span><span>prazo para conceder: ' + Fmt.data(a.limite) + '</span></div>' : '';
      const v = Regras.validarFerias({ inicio: ini, dias, abono }, f, Dt.hoje(), FERIADOS);
      $a('ag-regras').innerHTML = (v.erros.length || v.avisos.length ? '' : '<div class="av" style="cursor:default;border:none;--c:var(--ok-ink);--c-soft:var(--ok-soft)"><span class="ic">' + ic('checkCirc') + '</span><span><b>Tudo certo com a CLT</b><span>Aviso com antecedência, início fora dos 2 dias antes de folga ou feriado e dentro do prazo.</span></span></div>') +
        v.erros.map(t => '<div class="av erro" style="cursor:default"><span class="ic">' + ic('alerta') + '</span><span><b>' + esc(t) + '</b></span></div>').join('') +
        v.avisos.map(t => '<div class="av aviso" style="cursor:default"><span class="ic">' + ic('relogio') + '</span><span><b>' + esc(t) + '</b></span></div>').join('');
      $a('ag-ok').disabled = !!v.erros.length;
      $a('ag-msg').textContent = v.erros.length ? 'Corrija o que está em vermelho.' : v.avisos.length ? 'Dá para agendar, mas confira os avisos.' : '';
    }
    g.addEventListener('click', e => {
      if (e.target.closest('[data-fechar]')) { UI.fecharGaveta(); return; }
      const b = e.target.closest('#ag-dias button'); if (b) { $a('ag-dias').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); dias = Number(b.dataset.v); atualizar(); }
    });
    $a('ag-p').addEventListener('change', () => { sugerirInicio(); atualizar(); });
    $a('ag-ini').addEventListener('input', atualizar);
    $a('ag-abono').addEventListener('change', e => { if (e.target.checked && dias > 20) { const b = $a('ag-dias').querySelector('[data-v="20"]'); b.click(); } else atualizar(); });
    $a('ag-ok').addEventListener('click', async () => {
      const p = pessoa(), b = $a('ag-ok'); b.disabled = true; b.textContent = 'Agendando…';
      try {
        await API.ferias.agendar({ colaborador_id: p.id, inicio: $a('ag-ini').value, dias, abono: $a('ag-abono').checked, periodo_inicio: p.ferias_info.alvo.ini });
        D.mudou('pessoas', 'ferias', 'tarefas');
        UI.fecharGaveta();
        UI.toast('Férias de ' + Fmt.primeiroUltimo(p.nome) + ' agendadas · 2 tarefas criadas na agenda', 'ok', { rot: 'Ver agenda', fazer: () => App.ir('agenda') });
        if (['ferias', 'inicio', 'colaboradores', 'agenda'].includes(App.rota())) App.mostrar();
      } catch (x) { $a('ag-msg').textContent = x.message; b.disabled = false; b.innerHTML = ic('check') + 'Agendar férias'; }
    });
    sugerirInicio(); atualizar();
  }
  return { titulo: 'Férias e experiência', render, agendar, abaAtual: () => st.aba };
})();

/* =====================================================================
   TELA · FOLHA DE PAGAMENTO — antes era uma página gigante; agora cada
   pergunta tem a sua aba: visão do mês, composição, por pessoa, extrato
   completo e conferência. O seletor de mês vale para todas as abas.
   ===================================================================== */
Telas.folha = (function () {
  const st = { aba: 'visao', mes: null, comp: 'liq', q: '', ord: { k: 'bruto', d: -1 }, mm: 'mensal' };
  let F = [], g = null;
  const cor = { liq: 'var(--s1)', desc: 'var(--s3)', enc: 'var(--s2)', prov: 'var(--s4)' };
  const atual = () => st.mes === 'ano' ? somar(F) : F.find(f => f.comp === st.mes);
  const anterior = () => { const i = F.findIndex(f => f.comp === st.mes); return i > 0 ? F[i - 1] : null; };
  function somar(L) { const o = { comp: 'ano', pessoas: Math.round(media(L, f => f.pessoas)) }; Object.keys(L[0]).forEach(k => { if (typeof L[0][k] === 'number' && k !== 'pessoas' && k !== 'absenteismo' && k !== 'absControlavel') o[k] = r2(soma(L, f => f[k])); }); o.custoMedio = o.custo / L.length / (o.pessoas || 1); return o; }
  const rotSel = () => st.mes === 'ano' ? 'os últimos 12 meses' : Fmt.mes(st.mes);
  const stIcon = s => s === 'conferido' ? '<i class="ponto ok"></i>' : s === 'atencao' ? '<i class="ponto warn"></i>' : '<i class="ponto bad"></i>';

  function seletorMeses() {
    return '<div class="meses" id="fo-meses" role="group" aria-label="Mês">' + F.map(f => '<button type="button" class="mes" data-mes="' + f.comp + '" aria-pressed="' + (f.comp === st.mes) + '" title="' + esc(Fmt.mesTitulo(f.comp) + ' · ' + (f.extrato ? f.extrato.nota : '')) + '">' + MES3[Number(f.comp.slice(5)) - 1] + '<small>' + stIcon(f.extrato.situacao) + f.comp.slice(2, 4) + '</small></button>').join('') +
      '<button type="button" class="mes ano" data-mes="ano" aria-pressed="' + (st.mes === 'ano') + '">12 meses<small>soma</small></button></div>';
  }

  // ------------------------------------------------------------ abas
  function visao() {
    const x = atual(), a = anterior(), vs = a ? Fmt.mesCurto(a.comp) : '';

  function composicao() {

      const esc_ = x.bruto || 1, pc = v => v / esc_ * 100;

      h += linha('Folha bruta', 'total de proventos', x.bruto, [[0, pc(x.liquido), cor.liq], [pc(x.liquido) + .3, 100, cor.desc]], true);
      [['INSS dos empregados', 'retido de cada pessoa', x.inss], ['Adiantamentos já pagos', 'vale do dia 20', x.adiantamento], ['Vale-transporte (6%)', 'parte paga pela pessoa', x.vt], ['Crédito do trabalhador', 'consignado repassado ao banco', x.consignado], ['Faltas e atrasos', Fmt.int(x.faltas_horas) + ' h descontadas', x.faltas_valor], ['Imposto de renda', 'IRRF', x.irrf]].forEach(([r, s, v]) => { if (!v) return; h += linha(r, s + ' · ' + Fmt.pct(v / esc_ * 100) + ' do bruto', v, [[pc(resto - v), pc(resto), cor.desc]], false, '− '); resto -= v; });
      h += linha('Folha líquida', 'a pagar no fechamento', x.liquido, [[0, pc(x.liquido), cor.liq]], true);
    } else {
      const fim = x.custoFolha + Math.max(0, x.provisoes - x.feriasComEnc) + x.va, esc_ = Math.max(fim, x.custo, x.bruto) || 1, pc = v => v / esc_ * 100;
      let cum = x.bruto;
      h += linha('Folha bruta', 'total de proventos', x.bruto, [[0, pc(x.liquido), cor.liq], [pc(x.liquido) + .3, pc(x.bruto), cor.desc]], true);

      h += linha('Custo da folha', 'bruto + encargos', x.custoFolha, [[0, pc(x.liquido), cor.liq], [pc(x.liquido) + .3, pc(x.bruto), cor.desc], [pc(x.bruto) + .3, pc(x.custoFolha), cor.enc]], true);
      const prov = x.provisoes - x.feriasComEnc;
      h += linha('Provisões de 13º e férias', 'estimativa, já sem as férias pagas no mês', prov, [[pc(Math.min(cum, cum + prov)), pc(Math.max(cum, cum + prov)), cor.prov]], false, prov >= 0 ? '+ ' : '− '); cum += prov;
      h += linha('Vale-alimentação', Fmt.brl(Base.PARAM.va_dia) + ' por dia trabalhado', x.va, [[pc(cum), pc(cum + x.va), cor.prov]], false, '+ '); cum += x.va;
      h += linha('Custo total', 'por competência', x.custo, [[0, pc(x.liquido), cor.liq], [pc(x.liquido) + .3, pc(x.bruto), cor.desc], [pc(x.bruto) + .3, pc(x.custoFolha), cor.enc], [pc(x.custoFolha) + .3, pc(x.custo), cor.prov]], true);
    }
    const prov = [['Salários', x.salario_mes], ['Horas extras + DSR', x.he_valor], ['Adicional noturno', x.noturno_valor], ['Férias + 1/3', x.ferias_valor], ['Rescisões', x.rescisao_valor], ['Afastamentos (15 dias)', x.afastamento_valor]].filter(p => p[1] > 0);
    return '<div class="grade g-3-2"><section class="painel"><div class="painel-cab"><div><h2>' + (lado === 'liq' ? 'Do bruto ao líquido' : 'Do bruto ao custo') + '</h2><span class="sub">' + esc(rotSel()) + '</span></div>' + UI.seg('fo-comp', [{ v: 'liq', rot: 'Bruto → líquido' }, { v: 'custo', rot: 'Bruto → custo' }], lado, 'sm') + '</div><div class="painel-corpo"><div class="cascata">' + h + '</div></div></section>' +
      '<section class="painel"><div class="painel-cab"><div><h2>Do que é feito o bruto</h2><span class="sub">proventos por grupo</span></div></div><div class="painel-corpo" style="padding-top:8px">' + UI.ranking(prov.map(p => ({ rot: p[0], v: p[1], txt: Fmt.brl(p[1]), extra: Fmt.pct(p[1] / (x.bruto || 1) * 100) }))) + '</div></section></div>';
  }

      '</tbody><tfoot><tr><td colspan="7">*Custo estimado: bruto + INSS da empresa, RAT, terceiros, FGTS e VA da pessoa no mês. Bruto da lista: <b>' + Fmt.brl(soma(M, x => x.bruto)) + '</b> · líquido <b>' + Fmt.brl(soma(M, x => x.liquido)) + '</b></td></tr></tfoot></table></div></section>';

Telas.aniversariantes = (function () {
  let mes = null;
  // o botão do brinde aparece quando o aniversário (deste ano) já chegou ou está a até 7 dias
  const comBrinde = (p, hoje) => p.brinde && p.brinde.dia <= Dt.soma(hoje, 7);
  function resumoBrinde(L, hoje) {
    // atrasado = o dia já passou; o do dia conta como "a entregar"
    const E = L.filter(p => comBrinde(p, hoje)).map(p => p.brinde.estado === 'pendente' && !p.brinde.atraso ? 'a_entregar' : p.brinde.estado); if (!E.length) return '';
    const n = k => E.filter(x => x === k).length, partes = [];
    if (n('entregue')) partes.push('<span class="tag ok">' + n('entregue') + ' entregue' + (n('entregue') > 1 ? 's' : '') + '</span>');
    if (n('pendente')) partes.push('<span class="tag warn">' + n('pendente') + ' não entregue' + (n('pendente') > 1 ? 's' : '') + '</span>');
    if (n('a_entregar')) partes.push('<span class="tag">' + n('a_entregar') + ' a entregar</span>');
    return '<span class="dim" style="font-size:13px">Brindes:</span> ' + partes.join(' ');
  }
  async function render(el) {
    const P = (await D.pessoas()).filter(p => p.situacao_ref !== 'Inativo'), hoje = Dt.hoje(), mHoje = new Date().getMonth() + 1;
    if (!mes) mes = mHoje;
    const porMes = Array.from({ length: 12 }, (_, i) => P.filter(p => p.aniv.mes === i + 1).length);
    const prox = P.filter(p => p.aniv.faltam <= 7).sort((a, b) => a.aniv.faltam - b.aniv.faltam);
    const pend = P.filter(p => p.brinde && p.brinde.estado === 'pendente' && p.brinde.atraso > 0 && p.brinde.atraso <= 30).sort((a, b) => a.brinde.atraso - b.brinde.atraso);
    const L = P.filter(p => p.aniv.mes === mes).sort((a, b) => a.aniv.dia - b.aniv.dia);
    // modo: 'prox' (próximo aniversário), 'pend' (brinde atrasado), 'mes' (calendário do ano)
    const card = (p, modo) => {
      const iso = new Date().getFullYear() + '-' + String(p.aniv.mes).padStart(2, '0') + '-' + String(p.aniv.dia).padStart(2, '0');
      const passou = mes === mHoje && p.aniv.dia < new Date().getDate() || mes < mHoje;
      // idade: no próximo aniversário (prox) ou no aniversário deste ano (fez/faz)
      const idadeAno = Number(iso.slice(0, 4)) - Number(p.nascimento.slice(0, 4));
      const idadeTxt = modo === 'prox' ? 'faz ' + p.aniv.faz : (iso < hoje ? 'fez ' : 'faz ') + idadeAno;
      const mostraBrinde = modo === 'prox' ? p.brinde && p.brinde.dia === p.aniv.data : comBrinde(p, hoje);
      const quando = modo === 'prox' ? '<span class="tag ' + (p.aniv.faltam === 0 ? 'festa' : '') + '">' + (p.aniv.faltam === 0 ? 'hoje' : p.aniv.faltam === 1 ? 'amanhã' : 'em ' + p.aniv.faltam + ' dias') + '</span>'
        : modo === 'pend' ? '<span class="tag warn">há ' + p.brinde.atraso + ' dia' + (p.brinde.atraso > 1 ? 's' : '') + '</span>' : p.aniv.faltam === 0 ? '<span class="tag festa">hoje</span>' : '';
      return '<div class="card-p' + (p.aniv.faltam === 0 ? ' hoje' : '') + (modo === 'mes' && passou ? ' passou' : '') + '"><button type="button" class="card-p-abre" data-ficha="' + p.id + '"><span class="dia"><b>' + String(p.aniv.dia).padStart(2, '0') + '</b><small>' + (modo === 'mes' ? Dt.semana(iso).slice(0, 3) : MES3[p.aniv.mes - 1]) + '</small></span><span style="min-width:0"><b class="nm">' + esc(p.nome) + '</b><small class="sb">' + esc(p.funcao) + ' · ' + idadeTxt + ' anos</small></span>' + quando + '</button>' + (mostraBrinde ? UI.brinde(p) : '') + '</div>';
    };
    el.innerHTML = '<div id="an-wrap"><div class="cab"><div><h1>Aniversariantes</h1><p>O aviso aparece ' + Base.PARAM.aviso_aniversario + ' dias antes na Início e no sino. Marque o brinde quando entregar: se o aniversário passar sem a marca, vira aviso.</p></div></div>' +
      '<div class="ani-meses" id="an-meses">' + porMes.map((n, i) => '<button type="button" data-m="' + (i + 1) + '" aria-pressed="' + (i + 1 === mes) + '"' + (i + 1 === mHoje ? ' class="atual"' : '') + '>' + MES3[i] + '<small>' + (n || '—') + '</small></button>').join('') + '</div>' +
      (pend.length ? '<section class="painel" style="margin-bottom:18px"><div class="painel-cab"><div><h2>Brinde não entregue</h2><span class="sub">aniversários dos últimos 30 dias sem a marca de entregue</span></div><span class="tag warn">' + pend.length + '</span></div><div class="painel-corpo"><div class="cards-p">' + pend.map(p => card(p, 'pend')).join('') + '</div></div></section>' : '') +
      '<section class="painel" style="margin-bottom:18px"><div class="painel-cab"><h2>Próximos 7 dias</h2><span class="tag festa">' + prox.length + '</span></div><div class="painel-corpo"><div class="cards-p">' + (prox.length ? prox.map(p => card(p, 'prox')).join('') : UI.vazio('Ninguém faz aniversário nos próximos 7 dias')) + '</div></div></section>' +
      '<div class="cab" style="margin:8px 0 12px;align-items:flex-end"><div><h1 style="font-size:22px">' + MESES[mes - 1].charAt(0).toUpperCase() + MESES[mes - 1].slice(1) + ' <span class="dim" style="font-size:15px;font-weight:500;font-stretch:100%">' + L.length + ' aniversariante' + (L.length === 1 ? '' : 's') + '</span></h1></div><div class="an-resumo" id="an-resumo">' + resumoBrinde(L, hoje) + '</div></div>' +
      '<div class="cards-p">' + (L.length ? L.map(p => card(p, 'mes')).join('') : UI.vazio('Ninguém faz aniversário em ' + MESES[mes - 1])) + '</div></div>';
    document.getElementById('an-meses').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { mes = Number(b.dataset.m); render(el); } });
    document.getElementById('an-wrap').addEventListener('click', e => { const b = e.target.closest('[data-ficha]'); if (b) Telas.colaboradores.ficha(b.dataset.ficha); });
  }
  // depois de marcar um brinde, só o resumo do mês é refeito (o botão já se atualizou sozinho)
  document.addEventListener('brinde', async () => {

Telas.historico = (function () {
  const st = { q: '', usuario: '', area: '', aba: 'acoes', E: null };
  // auditoria do banco (só o gestor): carregada aos poucos, das mais novas para as mais antigas
  const au = { itens: null, fim: false, ultimo: null, q: '', usuario: '', tabela: '' };
  const COR = { registrou: 'var(--ok-ink)', desfez: 'var(--ink-3)', criou: 'var(--ok-ink)', importou: 'var(--ok-ink)', alterou: 'var(--info-ink)', desligou: 'var(--bad-ink)', excluiu: 'var(--bad-ink)', cancelou: 'var(--bad-ink)', agendou: 'var(--brand-ink)', concluiu: 'var(--ok-ink)', efetivou: 'var(--ok-ink)', concedeu: 'var(--brand-ink)', quitou: 'var(--ok-ink)', gerou: 'var(--ink-2)', trocou: 'var(--brand-ink)', salvou: 'var(--info-ink)' };
  const COR_AUD = { incluiu: 'var(--ok-ink)', alterou: 'var(--info-ink)', excluiu: 'var(--bad-ink)', 'criou o login': 'var(--ok-ink)', 'bloqueou o login': 'var(--bad-ink)', 'desbloqueou o login': 'var(--ok-ink)', 'definiu uma senha nova': 'var(--brand-ink)', 'trocou o e-mail de login': 'var(--brand-ink)' };
  const LUPA = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';
  const diaRot = d => Dt.relativo(d) === 'hoje' ? 'Hoje' : Dt.relativo(d) === 'ontem' ? 'Ontem' : Dt.semana(d) + ', ' + Fmt.data(d);
  const opcoes = (L, v, todos) => '<option value="">' + todos + '</option>' + L.map(x => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
  // busca com espera curta; ao redesenhar, devolve o foco para o campo
  function ligarBusca(id, aoMudar) {
    let t = 0; const i = document.getElementById(id); if (!i) return;
    i.addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { aoMudar(e.target.value); const n = document.getElementById(id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); });
  }

  // ------------------------------------------------------------ ações registradas pelo sistema
  function acoes(box) {
    const E = st.E || [];
    const us = [...new Set(E.map(e => e.usuario))], areas = [...new Set(E.map(e => e.area))];
    const q = norm(st.q);
    const L = E.filter(e => (!st.usuario || e.usuario === st.usuario) && (!st.area || e.area === st.area) && (!q || norm(e.acao + ' ' + e.texto + ' ' + (e.mud || '') + ' ' + e.usuario).includes(q)));
    const dias = agrupar(L, e => e.quando.slice(0, 10));
    box.innerHTML = '<div class="filtros"><label class="busca">' + LUPA + '<input class="inp" id="hi-q" type="search" placeholder="Buscar nome, ação ou campo" value="' + esc(st.q) + '"></label>' +
      '<select class="inp" id="hi-u">' + opcoes(us, st.usuario, 'Todos os usuários') + '</select>' +
      '<select class="inp" id="hi-a">' + opcoes(areas, st.area, 'Todas as áreas') + '</select><span class="conta">' + L.length + ' registro' + (L.length === 1 ? '' : 's') + '</span></div>' +
      '<div style="max-width:920px">' + ([...dias.keys()].map(d => '<div class="hist-dia">' + esc(diaRot(d)) + '</div>' + dias.get(d).map(e => '<div class="ev"><span class="hr">' + esc(e.quando.slice(11, 16)) + '</span>' + UI.avatar(e.usuario) + '<div class="tx" style="--c:' + (COR[e.acao] || 'var(--ink)') + '"><b>' + esc(e.usuario) + '</b> <em>' + esc(e.acao) + '</em> ' + esc(e.texto) + ' <span class="tag" style="margin-left:4px">' + esc(e.area) + '</span>' + (e.de || e.para ? '<div class="mud"><s>' + esc(e.de || '') + '</s> → <b>' + esc(e.para || '') + '</b></div>' : e.mud ? '<div class="mud">' + esc(e.mud) + '</div>' : '') + '</div></div>').join('')).join('') || UI.vazio('Nada encontrado', '', 'busca')) + '</div>';
    ligarBusca('hi-q', v => { st.q = v; acoes(box); });
    document.getElementById('hi-u').addEventListener('change', e => { st.usuario = e.target.value; acoes(box); });
    document.getElementById('hi-a').addEventListener('change', e => { st.area = e.target.value; acoes(box); });
  }

  // ------------------------------------------------------------ auditoria do banco (só o gestor)
  function camposHtml(x) {
    if (!x.campos.length) return '';
    if (x.campos[0].de !== undefined) return '<div class="mud">' + x.campos.map(c => esc(c.campo) + ': <s>' + esc(c.de) + '</s> → <b>' + esc(c.para) + '</b>').join('<br>') + '</div>';
    const M = 6, v = x.campos.slice(0, M).map(c => esc(c.campo) + ': <b>' + esc(c.valor) + '</b>').join(' · ');
    return '<div class="mud">' + v + (x.campos.length > M ? ' · <span class="dim">+' + (x.campos.length - M) + ' campos</span>' : '') + '</div>';
  }
  const linhaAud = x => '<div class="ev"><span class="hr">' + esc(x.quando.slice(11, 16)) + '</span>' + UI.avatar(x.usuario) + '<div class="tx" style="--c:' + (COR_AUD[x.op] || 'var(--ink)') + '"><b>' + esc(x.usuario) + '</b> <em>' + esc(x.op) + '</em>' + (x.alvo ? ' ' + esc(x.alvo) : '') + ' <span class="tag" style="margin-left:4px">' + esc(x.tabela) + '</span>' + camposHtml(x) + '</div></div>';
  // muitas linhas iguais no mesmo minuto (ex.: uma importação da folha) viram uma linha só, com a lista para abrir
  function blocos(L) {
    const B = [];
    L.forEach(x => {
      const b = B[B.length - 1];
      if (b && b[0].usuario === x.usuario && b[0].tabela === x.tabela && b[0].op === x.op && b[0].quando.slice(0, 16) === x.quando.slice(0, 16)) b.push(x); else B.push([x]);
    });
    return B.map(b => b.length < 4 ? b.map(linhaAud).join('') :
      '<div class="ev"><span class="hr">' + esc(b[0].quando.slice(11, 16)) + '</span>' + UI.avatar(b[0].usuario) + '<div class="tx" style="--c:' + (COR_AUD[b[0].op] || 'var(--ink)') + '"><b>' + esc(b[0].usuario) + '</b> <em>' + esc(b[0].op) + '</em> ' + b.length + ' registros <span class="tag" style="margin-left:4px">' + esc(b[0].tabela) + '</span><details class="aud-mais"><summary>ver quais</summary>' + b.map(x => '<div>' + esc(x.alvo || '—') + camposHtml(x) + '</div>').join('') + '</details></div></div>').join('');
  }
  async function auditoria(box) {
    if (!au.itens) { box.innerHTML = UI.vazio('Carregando a auditoria…', '', 'historico'); const r = await API.auditoria.listar(); au.itens = r.itens; au.fim = r.fim; au.ultimo = r.ultimo; }
    const I = au.itens, us = [...new Set(I.map(x => x.usuario))], tabs = [...new Set(I.map(x => x.tabela))].sort();
    const q = norm(au.q);
    const L = I.filter(x => (!au.usuario || x.usuario === au.usuario) && (!au.tabela || x.tabela === au.tabela) && (!q || norm(x.usuario + ' ' + x.op + ' ' + x.alvo + ' ' + x.tabela + ' ' + x.campos.map(c => c.campo + ' ' + (c.valor || '') + ' ' + (c.de || '') + ' ' + (c.para || '')).join(' ')).includes(q)));
    const dias = agrupar(L, x => x.quando.slice(0, 10));
    box.innerHTML = '<div class="insight" style="max-width:920px;margin:0 0 16px">' + ic('escudo') + '<span>Gravada pelo próprio banco a cada inclusão, alteração e exclusão, com o antes e o depois de cada campo. Ninguém, nem o gestor, consegue mudar ou apagar estes registros pelo sistema. Só o gestor vê esta aba.</span></div>' +
      '<div class="filtros"><label class="busca">' + LUPA + '<input class="inp" id="au-q" type="search" placeholder="Buscar pessoa, campo ou valor" value="' + esc(au.q) + '"></label>' +
      '<select class="inp" id="au-u">' + opcoes(us, au.usuario, 'Todos os usuários') + '</select>' +
      '<select class="inp" id="au-t">' + opcoes(tabs, au.tabela, 'Todas as áreas') + '</select><span class="conta">' + L.length + ' registro' + (L.length === 1 ? '' : 's') + (au.fim ? '' : ' carregados') + '</span></div>' +
      '<div style="max-width:920px" id="au-lista">' + ([...dias.keys()].map(d => '<div class="hist-dia">' + esc(diaRot(d)) + '</div>' + blocos(dias.get(d))).join('') || UI.vazio(I.length ? 'Nada encontrado' : 'A auditoria ainda está vazia', '', 'busca')) +
      (au.fim ? '' : '<div style="display:flex;justify-content:center;margin:14px 0"><button class="btn btn-sec" type="button" id="au-mais">Ver mais antigos</button></div>') + '</div>';
    ligarBusca('au-q', v => { au.q = v; auditoria(box); });
    document.getElementById('au-u').addEventListener('change', e => { au.usuario = e.target.value; auditoria(box); });
    document.getElementById('au-t').addEventListener('change', e => { au.tabela = e.target.value; auditoria(box); });
    const mais = document.getElementById('au-mais');
    if (mais) mais.addEventListener('click', async () => {
      if (mais.disabled) return; mais.disabled = true; mais.textContent = 'Carregando…';
      try { const r = await API.auditoria.listar(au.ultimo); au.itens.push(...r.itens); au.fim = r.fim; au.ultimo = r.ultimo || au.ultimo; }
      catch (x) { UI.toast(x.message, 'erro'); mais.disabled = false; mais.textContent = 'Ver mais antigos'; return; }
      auditoria(box);
    });
  }

  async function render(el) {
    const gestor = App.gestor();
    if (!gestor) st.aba = 'acoes';
    st.E = await API.historico.listar(); au.itens = null;   // ao entrar na tela, sempre do banco
    el.innerHTML = '<div class="cab"><div><h1>Histórico</h1><p>Tudo o que foi feito no sistema: quem, quando e o que mudou.</p></div></div>' +

  }
  return { titulo: 'Histórico', render };
})();

  // ------------------------------------------------------------ tela
  async function render(el, params) {
    if (params.aba) aba = SECOES.some(s => s[0] === params.aba) ? params.aba : 'funcionarios';
    const [cad, P] = await Promise.all([D.cad(), D.pessoas()]);
    const at = P.filter(p => p.situacao_ref !== 'Inativo'), pm = cad.param;
    const gestor = App.gestor();
    const corpo = aba === 'funcionarios' ? secFuncionarios(P) : aba === 'cargos' ? secCargos(cad, at) : aba === 'setores' ? secSetores(cad, at) : aba === 'turnos' ? secTurnos(cad, at) : aba === 'va' ? secVa(pm, at) : aba === 'empresa' ? secEmpresa(pm) : aba === 'listas' ? secListas(cad) : secAvisos(pm);
    el.innerHTML = '<div class="cab"><div><h1>Cadastros</h1><p>Quem trabalha aqui e os valores que o sistema usa para preencher e calcular: setores, cargos e salário da categoria, turnos, vale-alimentação, avisos e listas.</p></div></div>' +
      '<div class="conf"><nav class="painel conf-nav" id="cf-nav">' + SECOES.map(([v, r, i]) => '<button type="button" data-a="' + v + '" aria-pressed="' + (v === aba) + '">' + ic(i) + r + '</button>').join('') +
      (gestor ? '<button type="button" data-ir="usuarios">' + ic('escudo') + 'Usuários</button>' : '') + '</nav><section class="painel" id="cf-corpo">' + corpo + '</section></div>';
    const nav = document.getElementById('cf-nav'), on = nav.querySelector('[aria-pressed="true"]');
    if (on && nav.scrollWidth > nav.clientWidth) nav.scrollLeft += on.getBoundingClientRect().left - nav.getBoundingClientRect().left - 12;
    document.getElementById('cf-nav').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) { aba = b.dataset.a; trocarUrl('#/cadastros?aba=' + aba); render(el, {}); } });
    const corpoEl = document.getElementById('cf-corpo');
    if (aba === 'funcionarios') {
      UI.ligarSeg('fu-sit', v => { fst.sit = v; render(el, {}); });
      let t = 0;
      document.getElementById('fu-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { fst.q = e.target.value; const L = listaFunc(P); document.getElementById('fu-tb').innerHTML = linhasFunc(L); document.getElementById('fu-conta').textContent = L.length + ' pessoa' + (L.length === 1 ? '' : 's'); }, 150); });
    }
    corpoEl.addEventListener('change', async e => {
      const i = e.target.closest('[data-cargo]'); if (!i) return;
      const c = cad.cargos.find(x => x.id === i.dataset.cargo), v = Number(i.value);
      if (!(v > 0) || Math.abs(v - c.salario) < 0.005) return;
      i.disabled = true;
      try { await API.cadastros.salvarCargo(Object.assign({}, c, { salario: r2(v) })); } catch (x) { UI.toast(x.message, 'erro'); i.value = c.salario.toFixed(2); i.disabled = false; return; }
      i.disabled = false; D.mudou('cad'); c.salario = r2(v);
      UI.toast('Salário da categoria ' + c.nome + ': ' + Fmt.brl(v));
    });
    corpoEl.addEventListener('input', e => {
      if (e.target.id === 'va-dia' || e.target.id === 'va-dias') { const d = Number(document.getElementById('va-dia').value) || 0, n = Number(document.getElementById('va-dias').value) || 0, tot = document.getElementById('va-tot'); document.getElementById('va-mes').textContent = Fmt.brl(d * n); tot.textContent = Fmt.brl(d * n * Number(tot.dataset.n)); }
    });
    corpoEl.addEventListener('click', async e => {
      const ed = e.target.closest('[data-editar]'); if (ed) { e.stopPropagation(); Telas.colaboradores.novo(P.find(p => p.id === ed.dataset.editar)); return; }
      const tr = e.target.closest('tr[data-abrir]'); if (tr) { Telas.colaboradores.ficha(tr.dataset.abrir); return; }
      if (e.target.closest('#fu-novo')) { Telas.colaboradores.novo(); return; }
      if (e.target.closest('#cg-novo')) { novoCargo(); return; }
      if (e.target.closest('#st-novo')) { formSetor(); return; }
      const st = e.target.closest('[data-setor]'); if (st) { formSetor(st.dataset.setor); return; }
      if (e.target.closest('#tu-novo')) { formTurno(); return; }
      const tu = e.target.closest('[data-turno]'); if (tu) { formTurno(cad.turnos.find(x => x.id === tu.dataset.turno)); return; }
      const salvarParam = async (btn, dados, ok) => { if (btn.disabled) return false; btn.disabled = true; try { await API.cadastros.salvarParam(dados); } catch (x) { UI.toast(x.message, 'erro'); btn.disabled = false; return false; } btn.disabled = false; D.mudou('cad', 'pessoas'); UI.toast(ok); return true; };
      const vs = e.target.closest('#va-salvar');
      if (vs) { await salvarParam(vs, { va_dia: r2(Number(document.getElementById('va-dia').value) || 0), va_dias_mes: Number(document.getElementById('va-dias').value) || 22 }, 'Vale-alimentação salvo: ' + Fmt.brl(Number(document.getElementById('va-dia').value)) + ' por dia'); return; }
      const ls = e.target.closest('#li-salvar');
      if (ls) { const lista = id => [...new Set(document.getElementById(id).value.split('\n').map(x => x.trim()).filter(Boolean))]; if (await salvarParam(ls, { linhas_onibus: lista('li-linhas'), motivos_desligamento: lista('li-motivos'), maquinas: lista('li-maquinas') }, 'Listas salvas')) render(el, {}); return; }
      const em = e.target.closest('#em-salvar');
      if (em && !em.disabled) {
        const razao = document.getElementById('em-razao').value.trim(), cnpj = document.getElementById('em-cnpj').value.trim(), cidade = document.getElementById('em-cidade').value.trim();
        if (!razao || !cnpj || !cidade) { UI.toast('Preencha a razão social, o CNPJ e a cidade', 'erro'); return; }
        if (await salvarParam(em, { empresa: { razao, cnpj, cidade } }, 'Dados da empresa salvos')) render(el, {}); return;
      }
      const av = e.target.closest('#av-salvar');
      if (av) { const o = {}; corpoEl.querySelectorAll('[data-param]').forEach(i => { o[i.dataset.param] = Math.max(0, Math.min(120, Math.round(Number(i.value) || 0))); }); await salvarParam(av, o, 'Avisos salvos'); }
    });
  }
  return { titulo: 'Cadastros', render, abaAtual: () => aba, novoCargo, novoSetor: () => formSetor(), novoTurno: () => formTurno() };
})();

Telas.usuarios = (function () {
  const PERFIS = { Gestor: 'vê e altera tudo, inclusive os usuários', RH: 'vê valores (salário, CPF, folha, vales) e altera o cadastro', Consulta: 'só consulta pessoas, férias, agenda e aniversários; não vê valores' };
  // formulário de usuário: aberto pela tela e pelo botão + (Cadastro › Usuário)
  function form(u) {
    if (!App.gestor()) { UI.toast('Só o gestor cria e altera usuários', 'aviso'); return; }
    const eu = u && u.id === (App.sessao() || {}).id;
    const c = UI.abrirModal('<h2>' + (eu ? 'O seu usuário' : u ? 'Editar ' + esc(u.nome) : 'Novo usuário') + '</h2><p>' + (eu ? 'Aqui você muda o nome que aparece no sistema. Perfil, acesso, e-mail e senha da própria conta têm outro caminho, por segurança.' : u ? 'O login é o e-mail. A senha só muda se você escrever uma nova.' : 'A pessoa entra com este e-mail e a senha que você definir agora (ela pode trocar depois, no menu do usuário).') + '</p>' +
      '<div class="campos"><div class="campo largo"><label for="us-e">E-mail (login)</label><input id="us-e" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" value="' + esc(u ? u.email : '') + '"' + (eu ? ' disabled' : ' data-foco') + '>' + (eu ? '<span class="dica">o seu e-mail de login só outro gestor pode trocar</span>' : '') + '</div>' +
      '<div class="campo largo"><label for="us-n">Nome</label><input id="us-n" maxlength="80" value="' + esc(u ? u.nome : '') + '" placeholder="como aparece no sistema"></div>' +
      '<div class="campo"><label for="us-p">Perfil</label><select id="us-p"' + (eu ? ' disabled' : '') + '>' + Object.keys(PERFIS).map(p => '<option' + ((u ? u.perfil : 'RH') === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select><span class="dica" id="us-p-h"></span></div>' +
      (eu ? '<div class="campo"><label>Senha</label><span class="dica" style="margin-top:6px">a sua senha você troca em <b>Trocar a minha senha</b>, no menu do usuário (ela pede a senha atual)</span></div></div>'
        : '<div class="campo"><label for="us-s">' + (u ? 'Senha nova (opcional)' : 'Senha') + '</label><input id="us-s" type="password" autocomplete="new-password" placeholder="8 caracteres ou mais"><span class="dica"><button type="button" class="link" id="us-gerar" style="font-size:12px">gerar uma senha</button> <span id="us-ver"></span></span></div></div>') +
      '<label class="chk" style="margin:12px 0 4px"><input type="checkbox" id="us-a"' + (!u || u.ativo ? ' checked' : '') + (eu ? ' disabled' : '') + '> Acesso liberado' + (eu ? ' <span class="dim">(você não pode tirar o seu próprio acesso)</span>' : '') + '</label>' +
      '<div class="modal-pe"><span class="msg" id="us-msg"></span><button class="btn btn-ghost" type="button" data-fechar>Cancelar</button><button class="btn btn-pri" type="button" id="us-ok">' + (u ? 'Salvar' : 'Criar usuário') + '</button></div>');
    const dica = () => { document.getElementById('us-p-h').textContent = PERFIS[document.getElementById('us-p').value] || ''; };
    document.getElementById('us-p').addEventListener('change', dica); dica();
    UI.enterEnvia(c, '#us-ok');
    c.addEventListener('click', async e => {
      if (e.target.closest('[data-fechar]')) { UI.fecharModal(); return; }
      if (e.target.closest('#us-gerar')) {
        const A = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', r = new Uint32Array(12); crypto.getRandomValues(r);
        const sen = Array.from(r, x => A[x % A.length]).join('').replace(/^(.{4})(.{4})/, '$1-$2-');
        const i = document.getElementById('us-s'); i.value = sen; i.type = 'text';
        document.getElementById('us-ver').textContent = '· anote e passe para a pessoa';
        return;
      }
      const ok = e.target.closest('#us-ok'); if (!ok || ok.disabled) return;
      const msg = document.getElementById('us-msg'), email = eu ? u.email : document.getElementById('us-e').value.trim().toLowerCase(), nome = document.getElementById('us-n').value.trim();
      const perfil = document.getElementById('us-p').value, ativo = document.getElementById('us-a').checked, sIn = document.getElementById('us-s'), senha = eu || !sIn ? '' : sIn.value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = 'Escreva um e-mail válido.'; return; }
      if (!nome) { msg.textContent = 'Escreva o nome.'; return; }
      if (!u && senha.length < 8) { msg.textContent = 'A senha precisa ter 8 caracteres ou mais.'; return; }
      if (u && senha && senha.length < 8) { msg.textContent = 'A senha nova precisa ter 8 caracteres ou mais.'; return; }
      ok.disabled = true; ok.textContent = 'Salvando…';
      try { await API.usuarios.salvar({ id: u ? u.id : undefined, email, nome, perfil: eu ? u.perfil : perfil, senha: senha || undefined, ativo: eu ? true : ativo }, { novo: !u }); }
      catch (x) { msg.textContent = x.message; ok.disabled = false; ok.textContent = u ? 'Salvar' : 'Criar usuário'; return; }
      UI.fecharModal(); UI.toast(u ? 'Usuário salvo: ' + nome : 'Usuário criado: ' + nome + ' (' + email + ')', 'ok', App.rota() === 'usuarios' ? null : { rot: 'Ver lista', fazer: () => App.ir('usuarios') });
      if (eu) document.getElementById('btn-user').textContent = Fmt.iniciais(nome);
      if (App.rota() === 'usuarios') App.mostrar();
    });
  }
  async function render(el) {

/* =====================================================================
   TELA · COMPARATIVO DE MESES — de 2 a 6 meses fechados da folha lado a
   lado: tabela com a variação contra o primeiro mês, um gráfico por
   indicador, comparação por setor, CSV e PDF (pela impressão do navegador).
   Cada mês tem uma cor fixa enquanto estiver escolhido (a cor segue o mês,
   não a posição), igual em todos os gráficos e na tabela.
   ===================================================================== */
Telas.comparativo = (function () {
  const MAX = 6, NCORES = 6;
  const st = { meses: [], cores: {}, setor: '', porSetor: 'custo' };
  document.addEventListener('setor', e => { if (st.setor === e.detail.de) st.setor = e.detail.para; });
  let P, F, L, cad, grafs = [];

  // indicadores: cálculo, formato, e se subir é bom (false = subir é ruim; null = neutro)
  const IND = [
    { id: 'custo', g: 'Custo', rot: 'Custo total', sub: 'com encargos, provisões e VA', fmt: Fmt.brl0, curto: Fmt.compacto, v: x => x.t.custo, bom: false },
    { id: 'custoMedio', g: 'Custo', rot: 'Custo médio por pessoa', fmt: Fmt.brl0, curto: Fmt.compacto, v: x => x.t.custoMedio, bom: false },
    { id: 'bruto', g: 'Custo', rot: 'Folha bruta', fmt: Fmt.brl0, curto: Fmt.compacto, v: x => x.t.bruto, bom: false },
    { id: 'encargos', g: 'Custo', rot: 'Encargos', sub: 'INSS, RAT, terceiros e FGTS', fmt: Fmt.brl0, curto: Fmt.compacto, v: x => x.t.encargos, bom: false },
    { id: 'heh', g: 'Horas', rot: 'Horas extras', fmt: v => Fmt.int(v) + ' h', curto: v => Fmt.int(v) + ' h', v: x => x.t.he_horas, bom: false },
    { id: 'hev', g: 'Horas', rot: 'Valor das horas extras', sub: 'com DSR', fmt: Fmt.brl0, curto: Fmt.compacto, v: x => x.t.he_valor, bom: false },
    { id: 'hep', g: 'Horas', rot: 'Horas extras por pessoa', fmt: v => Fmt.dec(v, 1) + ' h', curto: v => Fmt.dec(v, 1) + ' h', v: x => x.t.pessoas ? x.t.he_horas / x.t.pessoas : 0, bom: false },
    { id: 'abs', g: 'Horas', rot: 'Absenteísmo', sub: 'faltas + atestados ÷ horas previstas', fmt: v => Fmt.pct(v, 2), curto: v => Fmt.pct(v, 1), v: x => x.t.absenteismo, bom: false, pontos: true },
    { id: 'faltas', g: 'Horas', rot: 'Faltas sem atestado', fmt: v => Fmt.dec(v, 1) + ' h', curto: v => Fmt.int(v) + ' h', v: x => x.t.faltas_horas, bom: false },
    { id: 'atest', g: 'Horas', rot: 'Atestados', fmt: v => Fmt.int(v) + ' dias', curto: v => Fmt.int(v) + ' d', v: x => x.t.atestados_dias, bom: false, abs: true },
    { id: 'quadro', g: 'Pessoas', rot: 'Pessoas no fim do mês', fmt: Fmt.int, curto: Fmt.int, v: x => x.quadro, bom: null, abs: true },
    { id: 'adm', g: 'Pessoas', rot: 'Admissões', fmt: Fmt.int, curto: Fmt.int, v: x => x.adm, bom: null, abs: true },
    { id: 'des', g: 'Pessoas', rot: 'Desligamentos', fmt: Fmt.int, curto: Fmt.int, v: x => x.des, bom: false, abs: true }
  ];
  const GRAFICOS = ['custo', 'custoMedio', 'heh', 'hep', 'abs', 'faltas', 'quadro', 'des'];
  const SETOR = [
    { v: 'custo', rot: 'Custo', fmt: Fmt.brl0, val: t => t.custo, bom: false },
    { v: 'heh', rot: 'Horas extras', fmt: v => Fmt.int(v) + ' h', val: t => t.he_horas, bom: false },
    { v: 'faltas', rot: 'Faltas', fmt: v => Fmt.dec(v, 1) + ' h', val: t => t.faltas_horas, bom: false },
    { v: 'abs', rot: 'Absenteísmo', fmt: v => Fmt.pct(v, 2), val: t => t.absenteismo, bom: false, pontos: true }
  ];
  const indDe = id => IND.find(i => i.id === id);
  const cor = c => 'var(--s' + ((st.cores[c] || 0) + 1) + ')';
  const rotMes = c => MES3[Number(c.slice(5)) - 1] + '/' + c.slice(2, 4);
  const ordenados = () => st.meses.slice().sort();
  const dif = (ind, v, vb) => UI.delta(v, vb, { bomSobe: ind.bom, pontos: ind.pontos, abs: ind.abs });

  // ------------------------------------------------------------ seleção (a cor do mês não muda enquanto ele estiver escolhido)
  function marcar(c) {
    if (st.meses.includes(c)) { st.meses = st.meses.filter(x => x !== c); delete st.cores[c]; return true; }
    if (st.meses.length >= MAX) { UI.toast('Dá para comparar até ' + MAX + ' meses de uma vez', 'aviso'); return false; }
    const usadas = new Set(Object.values(st.cores)); let k = 0; while (usadas.has(k) && k < NCORES) k++;
    st.meses.push(c); st.cores[c] = k; return true;
  }
  function escolher(lista) { st.meses = []; st.cores = {}; lista.slice().sort().forEach(marcar); }

  // ------------------------------------------------------------ números de um mês (respeitando o setor)
  function doMes(c) {
    const filtro = p => !st.setor || p.setor === st.setor;
    const t = st.setor ? Regras.totalizar(L.filter(x => x.comp === c && x.setor === st.setor), c) : F.find(f => f.comp === c);
    return { c, t, quadro: quadroNoMes(P, c, filtro), adm: P.filter(p => filtro(p) && Dt.comp(p.admissao) === c).length, des: P.filter(p => filtro(p) && p.desligamento && Dt.comp(p.desligamento) === c).length };
  }

  // ------------------------------------------------------------ partes da tela
  function htmlSelecao() {
    const C = F.map(f => f.comp);
    return '<section class="painel cp-sel" data-sem-impressao><div class="painel-corpo">' +
      '<div class="cp-sel-topo"><div><b>Meses</b><span class="dim"> · escolha de 2 a ' + MAX + ' · ' + st.meses.length + ' escolhido' + (st.meses.length === 1 ? '' : 's') + '</span></div>' +
        '<div class="cp-atalhos"><button type="button" class="chip" data-at="2">Último × anterior</button><button type="button" class="chip" data-at="3">Últimos 3</button><button type="button" class="chip" data-at="6">Últimos 6</button><button type="button" class="chip" data-at="tri">Trimestres</button><button type="button" class="chip" data-at="0">Limpar</button></div></div>' +
      '<div class="cp-meses" id="cp-meses">' + C.map(c => { const on = st.meses.includes(c); return '<button type="button" class="cp-mes' + (on ? ' on' : '') + '" data-c="' + c + '" aria-pressed="' + on + '"' + (on ? ' style="--cm:' + cor(c) + '"' : '') + '><i aria-hidden="true">' + ic('check') + '</i><b>' + MES3[Number(c.slice(5)) - 1] + '</b><small>' + c.slice(0, 4) + '</small></button>'; }).join('') + '</div>' +
      '<div class="cp-sel-pe"><select class="inp" id="cp-setor" aria-label="Setor"><option value="">Todos os setores</option>' + cad.setores.map(s => '<option' + (s === st.setor ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>' +
        '<span class="dim cp-nota">A variação é sempre contra o <b>primeiro mês</b> (o mais antigo). Totais dependem de quantas pessoas e dias úteis o mês teve: compare também as linhas por pessoa.</span></div>' +
      '</div></section>';
  }
  function htmlCabImpressao(M) {
    const s = App.sessao();
    return '<div class="so-impressao cp-imp"><div class="cp-imp-marca"><svg viewBox="0 0 34 26" width="30" height="23" aria-hidden="true"><path d="M2 2h30l-5 5H2zM2 10h26l-5 5H2zM2 18h20l-4 5H2z" fill="#F58634"/></svg><div><b>VITALBOR</b><span>Sistema de RH</span></div></div>' +
      '<div class="cp-imp-tit"><h1>Comparativo de meses</h1><p>' + M.map(x => esc(Fmt.mesTitulo(x.c))).join(' × ') + ' · ' + esc(st.setor || 'Todos os setores') + '</p></div>' +
      '<div class="cp-imp-meta">Emitido em ' + Fmt.data(Dt.hoje()) + ' às ' + new Date().toTimeString().slice(0, 5) + (s ? '<br>por ' + esc(s.nome) : '') + '</div></div>';
  }
  function htmlLegenda(M) { return '<div class="cp-leg">' + M.map(x => '<span><i style="background:' + cor(x.c) + '"></i>' + esc(Fmt.mesTitulo(x.c)) + (x === M[0] ? ' <em>base</em>' : '') + '</span>').join('') + '</div>'; }
  function htmlTabela(M) {
    let g = '', h = '<div class="tab-graf cp-tab-caixa"><table class="t cp-tab"><thead><tr><th><span>Indicador</span></th>' + M.map(x => '<th class="n"><span><i class="cp-pt" style="background:' + cor(x.c) + '"></i>' + rotMes(x.c) + '</span></th>').join('') + '<th class="n"><span>' + rotMes(M[M.length - 1].c) + ' × ' + rotMes(M[0].c) + '</span></th></tr></thead><tbody>';
    IND.forEach(ind => {
      if (ind.g !== g) { g = ind.g; h += '<tr class="cp-grupo"><td colspan="' + (M.length + 2) + '">' + esc(g) + '</td></tr>'; }
      const vals = M.map(x => ind.v(x)), base = vals[0];
      h += '<tr><td><b>' + esc(ind.rot) + '</b>' + (ind.sub ? '<small class="dim">' + esc(ind.sub) + '</small>' : '') + '</td>' +
        vals.map((v, i) => '<td class="n"><span class="cp-v">' + ind.fmt(v) + '</span>' + (i ? '<span class="cp-d">' + (dif(ind, v, base) || '<span class="dim">—</span>') + '</span>' : '<span class="cp-d"><span class="dim">base</span></span>') + '</td>').join('') +
        '<td class="n cp-var">' + (dif(ind, vals[vals.length - 1], base) || '<span class="dim">—</span>') + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }
  function resumo(M) {   // frase do que mudou entre o primeiro e o último mês
    const a = M[0], b = M[M.length - 1], txt = (id, txt_) => { const ind = indDe(id), va = ind.v(a), vb = ind.v(b); return txt_(va, vb, ind); };
    const pct = (va, vb) => va ? (vb - va) / Math.abs(va) * 100 : 0;
    const sinal = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Fmt.dec(Math.abs(n), 1);
    const custo = txt('custo', (va, vb) => 'o custo total ' + (vb >= va ? 'subiu ' : 'caiu ') + Fmt.dec(Math.abs(pct(va, vb)), 1) + '% (' + (vb >= va ? '+' : '−') + Fmt.brlCompacto(Math.abs(vb - va)) + ')');
    const he = txt('heh', (va, vb) => 'as horas extras ' + (vb >= va ? 'subiram ' : 'caíram ') + Fmt.dec(Math.abs(pct(va, vb)), 1) + '%');
    const ab = txt('abs', (va, vb) => 'o absenteísmo foi de ' + Fmt.pct(va, 1) + ' para ' + Fmt.pct(vb, 1) + ' (' + sinal(vb - va) + ' p.p.)');
    const q = txt('quadro', (va, vb) => 'o quadro ' + (vb === va ? 'ficou em ' + vb + ' pessoas' : 'foi de ' + va + ' para ' + vb + ' pessoas'));
    // o indicador "ruim" que mais piorou, em %
    const piores = IND.filter(i => i.bom === false && !i.pontos).map(i => ({ i, p: pct(i.v(a), i.v(b)) })).filter(x => x.p > 0.5).sort((x, y) => y.p - x.p);
    return 'De <b>' + esc(Fmt.mes(a.c)) + '</b> para <b>' + esc(Fmt.mes(b.c)) + '</b>' + (st.setor ? ' em <b>' + esc(st.setor) + '</b>' : '') + ': ' + custo + ', ' + he + ', ' + ab + ' e ' + q + '.' +
      (piores.length ? ' O que mais piorou foi <b>' + esc(piores[0].i.rot.toLowerCase()) + '</b> (+' + Fmt.dec(piores[0].p, 1) + '%).' : ' Nenhum indicador de custo piorou mais de 0,5%.');
  }
  function htmlSetores(M) {
    if (st.setor) return '';
    const s = SETOR.find(x => x.v === st.porSetor);
    const linhas = cad.setores.map(nome => ({ nome, vals: M.map(x => s.val(Regras.totalizar(L.filter(l => l.comp === x.c && l.setor === nome), x.c))) })).filter(r => r.vals.some(v => v > 0));
    linhas.sort((a, b) => b.vals[b.vals.length - 1] - a.vals[a.vals.length - 1]);
    const max = Math.max.apply(null, linhas.flatMap(r => r.vals).concat([0])) || 1;
    return '<section class="painel cp-setores"><div class="painel-cab"><div><h2>Por setor</h2><span class="sub">cada barra é um mês, na cor da legenda</span></div><div class="acoes" data-sem-impressao>' + UI.seg('cp-sm', SETOR.map(x => ({ v: x.v, rot: x.rot })), st.porSetor, 'sm') + '</div></div>' +
      '<div class="painel-corpo"><div class="tab-graf"><table class="t cp-st"><thead><tr><th><span>Setor</span></th>' + M.map(x => '<th><span><i class="cp-pt" style="background:' + cor(x.c) + '"></i>' + rotMes(x.c) + '</span></th>').join('') + '<th class="n"><span>Variação</span></th></tr></thead><tbody>' +
      linhas.map(r => '<tr><td><b>' + esc(r.nome) + '</b></td>' + r.vals.map((v, i) => '<td><div class="cp-barra"><i style="width:' + Math.max(1.5, v / max * 100) + '%;background:' + cor(M[i].c) + '"></i></div><span class="num">' + s.fmt(v) + '</span></td>').join('') +
        '<td class="n">' + (UI.delta(r.vals[r.vals.length - 1], r.vals[0], { bomSobe: s.bom, pontos: s.pontos }) || '<span class="dim">—</span>') + '</td></tr>').join('') +
      '</tbody></table></div></div></section>';
  }

  // ------------------------------------------------------------ desenho
  function limpar() { grafs.forEach(g => { try { g.destruir(); } catch (_) { } }); grafs = []; }
  function desenhar() {
    limpar();
    const corpo = document.getElementById('cp-corpo'); if (!corpo) return;
    const M = ordenados().map(doMes);
    document.getElementById('cp-imp-cab').innerHTML = M.length >= 2 ? htmlCabImpressao(M) : '';
    if (M.length < 2) { corpo.innerHTML = '<section class="painel"><div class="painel-corpo">' + UI.vazio('Escolha pelo menos 2 meses', 'Clique nos meses acima ou use um atalho, como "Último × anterior".', 'trocas') + '</div></section>'; return; }
    corpo.innerHTML = htmlLegenda(M) +
      '<div class="insight cp-insight">' + ic('lampada') + '<span>' + resumo(M) + '</span></div>' +
      '<section class="painel"><div class="painel-cab"><div><h2>Lado a lado</h2><span class="sub">cada valor traz a variação contra ' + esc(Fmt.mesCurto(M[0].c)) + ', o mês base</span></div></div><div class="painel-corpo" style="padding-top:4px">' + htmlTabela(M) + '</div></section>' +
      '<h2 class="cp-sec">Indicador por indicador</h2>' +
      '<div class="cp-grade">' + GRAFICOS.map(id => { const ind = indDe(id), a = ind.v(M[0]), b = ind.v(M[M.length - 1]); return '<section class="painel cp-card"><div class="cp-card-cab"><div><h3>' + esc(ind.rot) + '</h3><span class="cp-card-v">' + ind.fmt(b) + '</span></div>' + (dif(ind, b, a) || '') + '</div><div class="cp-g" id="cp-g-' + id + '"></div></section>'; }).join('') + '</div>' +
      htmlSetores(M) +
      '<p class="cp-rodape">Fonte: extratos mensais da folha (Domínio), meses fechados. Custo = bruto + encargos + provisões de 13º e férias + vale-alimentação.</p>';
    GRAFICOS.forEach(id => {
      const ind = indDe(id), vals = M.map(x => ind.v(x));
      grafs.push(App.graf(Graf.barras(document.getElementById('cp-g-' + id), {
        cats: M.map(x => rotMes(x.c)), titulos: M.map(x => Fmt.mesTitulo(x.c)), series: [{ id, nome: ind.rot, cor: 'var(--s1)', valores: vals }], coresCat: M.map(x => cor(x.c)),
        fmt: ind.fmt, fmtEixo: ind.curto, fmtRotulo: ind.curto, rotulo: 'todos', semEixoY: true, ticks: 2, altura: 168, larguraMax: 38, rotuloA11y: ind.rot + ' nos meses escolhidos',
        dicaExtra: i => i ? (dif(ind, vals[i], vals[0]) || '') + ' <span class="dim">vs ' + esc(Fmt.mesCurto(M[0].c)) + '</span>' : 'mês base'
      })));
    });
    if (!st.setor) ligarSetor(M);
  }
  // troca a métrica da tabela por setor sem redesenhar o resto
  function ligarSetor(M) {
    UI.ligarSeg('cp-sm', v => {
      st.porSetor = v;
      const sec = document.querySelector('#cp-corpo .cp-setores'); if (!sec) return;
      sec.outerHTML = htmlSetores(M);
      document.querySelector('#cp-corpo .cp-setores').style.animation = 'sobe .3s var(--ease) both';
      ligarSetor(M);
    });
  }
  function pintarSelecao() {
    const sel = document.getElementById('cp-sel'); if (!sel) return;
    sel.innerHTML = htmlSelecao();
    ligarSelecao();
  }
  function ligarSelecao() {
    document.getElementById('cp-meses').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; if (marcar(b.dataset.c)) { pintarSelecao(); desenhar(); guardarUrl(); } });
    document.querySelector('#cp-sel .cp-atalhos').addEventListener('click', e => {
      const b = e.target.closest('[data-at]'); if (!b) return;
      const C = F.map(f => f.comp), a = b.dataset.at;
      if (a === 'tri') { const n = C.length; escolher([C[n - 1], C[n - 4], C[n - 7], C[n - 10]].filter(Boolean)); }   // último mês de cada trimestre
      else escolher(C.slice(-Number(a)));
      pintarSelecao(); desenhar(); guardarUrl();
    });
    document.getElementById('cp-setor').addEventListener('change', e => { st.setor = e.target.value; desenhar(); guardarUrl(); });
  }
  const guardarUrl = () => trocarUrl('#/comparativo?meses=' + ordenados().join(',') + (st.setor ? '&setor=' + encodeURIComponent(st.setor) : ''));

  // ------------------------------------------------------------ exportar
  function exportarCsv() {
    const M = ordenados().map(doMes); if (M.length < 2) { UI.toast('Escolha pelo menos 2 meses', 'erro'); return; }
    const num = v => typeof v === 'number' ? String(Math.round(v * 100) / 100).replace('.', ',') : v;
    const L1 = [['Comparativo de meses', st.setor || 'Todos os setores'], [], ['Indicador'].concat(M.map(x => Fmt.mesCurto(x.c))).concat(['Variação ' + Fmt.mesCurto(M[M.length - 1].c) + ' x ' + Fmt.mesCurto(M[0].c) + ' (%)'])];
    IND.forEach(ind => { const vals = M.map(x => ind.v(x)), a = vals[0], b = vals[vals.length - 1]; L1.push([ind.rot].concat(vals.map(num)).concat([ind.pontos ? num(b - a) + ' p.p.' : a ? num((b - a) / Math.abs(a) * 100) : ''])); });
    if (!st.setor) {
      SETOR.forEach(s => {
        L1.push([], ['Por setor: ' + s.rot].concat(M.map(x => Fmt.mesCurto(x.c))));
        cad.setores.forEach(nome => L1.push([nome].concat(M.map(x => num(s.val(Regras.totalizar(L.filter(l => l.comp === x.c && l.setor === nome), x.c)))))));
      });
    }
    const csv = L1.map(l => l.map(c => /[;"\n]/.test(String(c)) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(';')).join('\r\n');
    UI.baixarCsv('comparativo-' + ordenados().join('_') + '.csv', csv, 'Comparativo exportado');
  }
  function gerarPdf() {
    if (st.meses.length < 2) { UI.toast('Escolha pelo menos 2 meses', 'erro'); return; }
    // relatório claro e com o nome do arquivo certo; tudo volta ao normal depois da impressão
    const raiz = document.documentElement, temaAntes = raiz.getAttribute('data-theme'), tituloAntes = document.title;
    raiz.setAttribute('data-theme', 'light');
    document.title = 'Comparativo ' + ordenados().map(Fmt.mesCurto).join(' x ').replace(/\//g, '-') + (st.setor ? ' - ' + st.setor : '') + ' - Vitalbor RH';
    document.body.classList.add('imprimindo');
    const fim = () => { window.removeEventListener('afterprint', fim); document.body.classList.remove('imprimindo'); document.title = tituloAntes; raiz.setAttribute('data-theme', temaAntes || 'light'); };
    window.addEventListener('afterprint', fim);
    let embutido = true; try { embutido = window.self !== window.top; } catch (_) { }
    if (embutido) UI.toast('Se a janela de impressão não abrir, abra o arquivo direto no Chrome ou no Edge: a pré-visualização bloqueia a impressão.', 'aviso');
    setTimeout(() => {
      try { window.print(); } catch (_) { fim(); return; }
      // na pré-visualização a impressão é ignorada sem evento: desfaz sozinho. Fora dela, quem desfaz é o afterprint
      if (embutido) setTimeout(() => { if (document.body.classList.contains('imprimindo')) fim(); }, 1500);
    }, 60);
  }

  // ------------------------------------------------------------ tela
  async function render(el, params) {
    if (!Store.tem('linhas')) el.innerHTML = UI.esqueleto(6);
    [P, F, L, cad] = await Promise.all([D.pessoas(), D.folha(), D.linhas(), D.cad()]);
    if (F.length < 2) {
      el.innerHTML = '<div class="cab"><div><h1>Comparativo de meses</h1><p>Meses fechados da folha lado a lado, com gráficos, CSV e PDF.</p></div></div><section class="painel"><div class="painel-corpo">' +
        UI.vazio(F.length ? 'Só um mês da folha foi importado' : 'Nenhum mês da folha importado ainda', 'O comparativo precisa de pelo menos 2 meses fechados da folha (extrato do Domínio).', 'trocas') + '</div></section>';
      return;
    }
    const C = F.map(f => f.comp);
    if (params.meses) escolher(params.meses.split(',').filter(c => C.includes(c)).slice(0, MAX));
    if (params.setor !== undefined) st.setor = cad.setores.includes(params.setor) ? params.setor : '';
    if (st.meses.length === 0) escolher(C.slice(-2));
    el.innerHTML = '<div id="cp-wrap"><div class="cab" data-sem-impressao><div><h1>Comparativo de meses</h1><p>Meses fechados da folha lado a lado. Escolha os meses e, se quiser, um setor; os gráficos e a tabela acompanham.</p></div>' +
      '<div class="cab-acoes"><button class="btn btn-sec" type="button" id="cp-csv">' + ic('baixar') + 'Exportar CSV</button><button class="btn btn-pri" type="button" id="cp-pdf">' + ic('doc') + 'Gerar PDF</button></div></div>' +
      '<div id="cp-imp-cab"></div><div id="cp-sel"></div><div id="cp-corpo"></div></div>';
    pintarSelecao(); desenhar();
    document.getElementById('cp-csv').addEventListener('click', exportarCsv);
    document.getElementById('cp-pdf').addEventListener('click', gerarPdf);
  }
  return { titulo: 'Comparativo de meses', render };
})();

/* =====================================================================

Telas.adiantamentos = (function () {

        (pend ? '<button type="button" class="btn btn-ghost btn-sm" data-todos="' + b.o + '">' + ic('check') + (pend === 1 ? 'Marcar como descontado' : 'Marcar os ' + pend + ' como descontados') + '</button>' : '<span class="tag ok">tudo descontado</span>') + '</div>' +
        '<div class="tab-graf" style="max-height:none"><table class="t"><thead><tr><th><span>Pessoa</span></th><th><span>Parcela</span></th><th class="n"><span>Valor</span></th><th><span>Desconto</span></th></tr></thead><tbody>' +

  function linhasAbertos() {

  function desenharAba() {

  async function atualizar() { D.mudou('vales'); V = await D.vales(); }
  async function alternar(id, n, feito, btn) {
    if (btn) btn.disabled = true;

    await atualizar();
    const v = V.find(x => x.id === id), x = v && v.parcelas.find(k => k.n === n);
    if (App.rota() === 'adiantamentos') desenharAba();

    return v;
  }
  async function todos(onde, btn) {
    const L = V.filter(v => !v.cancelado).flatMap(v => v.parcelas.filter(x => x.comp === st.mes && x.onde === onde && x.estado === 'prevista').map(x => [v.id, x.n]));
    if (!L.length) return;
    btn.disabled = true;
    for (const [id, n] of L) await API.vales.descontar(id, n, true);
    await atualizar(); desenharAba();
    UI.toast(Fmt.plural(L.length, 'desconto confirmado', 'descontos confirmados') + ' no ' + (onde === 'vale' ? 'vale' : onde === 'folha' ? 'pagamento' : '13º') + ' de ' + Fmt.mesCurto(st.mes));
